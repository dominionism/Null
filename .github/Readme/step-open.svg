<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 232" width="860" height="232" fill="none" role="img" aria-label="3. Open the box. First time: With no provider signed in, the box opens by itself, once, and shows the sign-in list Control+Space: Open the box /login: Add a provider, if you need one /model: Choose one of its models Then: Type your request. You do not need to leave a terminal running.">
  <title>3. Open the box. First time: With no provider signed in, the box opens by itself, once, and shows the sign-in list Control+Space: Open the box /login: Add a provider, if you need one /model: Choose one of its models Then: Type your request. You do not need to leave a terminal running.</title>
  <style>
    text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .rise { animation: rise .35s ease-out both; }
    .fade { animation: fade .4s ease-out both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hold { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <clipPath id="win"><rect x="0.5" y="0.5" width="859" height="231" rx="12"/></clipPath>
  <g clip-path="url(#win)">
  <rect width="860" height="232" fill="#0D1117"/>
  <rect width="860" height="30" fill="#161B22"/>
  <path d="M0 29.5H860" stroke="#21262D"/>
  <circle cx="20" cy="15.0" r="5.5" fill="#FF5F57"/>
  <circle cx="38" cy="15.0" r="5.5" fill="#FEBC2E"/>
  <circle cx="56" cy="15.0" r="5.5" fill="#28C840"/>
  <text x="430.0" y="19.0" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="middle">3. Open the box</text>
  <text x="24" y="83.0" font-size="12.5" font-weight="700" fill="#3FB950">First time</text>
  <text x="170.25" y="83.0" font-size="12.5" fill="#C9D1D9">With no provider signed in, the box opens by itself, once, and shows the sign-in</text>
  <text x="170.25" y="102.0" font-size="12.5" fill="#C9D1D9">list</text>
  <text x="24" y="128.0" font-size="12.5" font-weight="700" fill="#3FB950">Control+Space</text>
  <text x="170.25" y="128.0" font-size="12.5" fill="#C9D1D9">Open the box</text>
  <text x="24" y="154.0" font-size="12.5" font-weight="700" fill="#3FB950">/login</text>
  <text x="170.25" y="154.0" font-size="12.5" fill="#C9D1D9">Add a provider, if you need one</text>
  <text x="24" y="180.0" font-size="12.5" font-weight="700" fill="#3FB950">/model</text>
  <text x="170.25" y="180.0" font-size="12.5" fill="#C9D1D9">Choose one of its models</text>
  <text x="24" y="206.0" font-size="12.5" font-weight="700" fill="#3FB950">Then</text>
  <text x="170.25" y="206.0" font-size="12.5" fill="#C9D1D9">Type your request. You do not need to leave a terminal running.</text>
