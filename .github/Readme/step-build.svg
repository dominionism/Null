    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hold { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .c0 { opacity: 0; transform: translateX(600.6px); animation: c0 4.235s steps(77, end) 0.350s both, hold 4.835s linear both; }
    @keyframes c0 { from { transform: translateX(0); } }
    .c1 { opacity: 0; transform: translateX(366.6px); animation: c1 2.585s steps(47, end) 5.335s both, hold 8.170s linear both; }
    @keyframes c1 { from { transform: translateX(0); } }
    .c2 { opacity: 0; transform: translateX(468.0px); animation: c2 3.300s steps(60, end) 8.670s both, hold 12.220s linear both; }
    @keyframes c2 { from { transform: translateX(0); } }
    .c3 { opacity: 0; transform: translateX(156.0px); animation: c3 1.100s steps(20, end) 12.720s both, hold 14.070s linear both; }
    @keyframes c3 { from { transform: translateX(0); } }
  </style>
