<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 362" width="860" height="362" fill="none" role="img" aria-label="2. Build and install. An Apple Silicon Mac with macOS 13+, the Rust toolchain, Xcode Command Line Tools and Tauri CLI 2. No Node, Bun, Python or Voice server is needed for the box. $ xcode-select --install           # once, if the Apple tools are not installed $ cargo install tauri-cli --version &quot;^2&quot; --locked $ git clone https://github.com/dominionism/Null.git &amp;&amp; cd Null $ Mini/Scripts/install The script fetches the Oh-my-pi named in Mini/Engine.toml (about 214 MB) and keeps it only if its checksum matches. Then it builds Null.app, installs it, registers a login item and starts it, replacing any previously installed Null app. A source-build workflow with local signing support, not a notarized release installer.">
  <title>2. Build and install. An Apple Silicon Mac with macOS 13+, the Rust toolchain, Xcode Command Line Tools and Tauri CLI 2. No Node, Bun, Python or Voice server is needed for the box. $ xcode-select --install           # once, if the Apple tools are not installed $ cargo install tauri-cli --version &quot;^2&quot; --locked $ git clone https://github.com/dominionism/Null.git &amp;&amp; cd Null $ Mini/Scripts/install The script fetches the Oh-my-pi named in Mini/Engine.toml (about 214 MB) and keeps it only if its checksum matches. Then it builds Null.app, installs it, registers a login item and starts it, replacing any previously installed Null app. A source-build workflow with local signing support, not a notarized release installer.</title>
  <style>
    text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
