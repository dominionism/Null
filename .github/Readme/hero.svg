<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Null. Your agent, a shortcut away.</title>
  <desc id="description">A monochrome illustration of Null's pet above the floating input, with the prompt “What are we building?” and the Control plus Space shortcut. The pet moves as it does at rest in the app: it bobs, blinks and lifts its antenna, a square at a time. Motion is disabled for reduced motion.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171719"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="outline" x1="100" y1="281" x2="860" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f5f5"/>
      <stop offset="1" stop-color="#77777d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(760 155) rotate(90) scale(255 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x=".5" y=".5" width="959" height="439" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .panel { animation: arrive .8s ease-out both; }
    .cursor { animation: blink 1.2s steps(1, end) 3; }
    /* The pet at rest, as Mini/Page/index.html moves it: every movement is one whole square. */
    .pet { shape-rendering: crispEdges; }
    .pet .top { animation: pet-bob 2.6s steps(1) infinite; }
    .pet .eyes { animation: pet-blink 4.4s steps(1) infinite; }
    .pet .flag { animation: pet-twitch 5.2s steps(1) infinite; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49%, 100% { opacity: 1; } 50%, 99% { opacity: 0; } }
    @keyframes pet-bob { 60% { transform: translateY(1px); } }
    @keyframes pet-blink { 93% { opacity: 0; } 97% { opacity: 1; } }
    @keyframes pet-twitch { 90% { transform: translateY(-1px); } 95% { transform: none; } }
    @media (prefers-reduced-motion: reduce) { .panel, .cursor, .pet .top, .pet .eyes, .pet .flag { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="960" height="440" fill="url(#background)"/>
    <rect width="960" height="440" fill="url(#glow)"/>
    <g stroke="#ffffff" stroke-opacity=".045">
      <circle cx="780" cy="170" r="104"/>
      <circle cx="780" cy="170" r="156"/>
      <circle cx="780" cy="170" r="208"/>
    </g>
    <path d="M54 45L65 56L54 67" stroke="#fafafa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="64" class="mono" font-size="24" font-weight="600" letter-spacing="2" fill="#fafafa">Null</text>
    <text x="907" y="61" class="mono" font-size="12" letter-spacing="2" text-anchor="end" fill="#a1a1aa">A SMALL BOX FOR REAL WORK</text>
    <text x="51" y="157" class="sans" font-size="66" font-weight="600" letter-spacing="-2.5" fill="#fafafa">Your agent.</text>
    <text x="51" y="229" class="sans" font-size="66" font-weight="600" letter-spacing="-2.5" fill="#a1a1aa">A shortcut away.</text>
    <!-- The pet, drawn as the page draws it: a grid of 16 squares, its parts and their names from
         Mini/Page/index.html. The light edge is each part again, a third of a square wider, under
         all of the black, so that it follows whatever moves. -->
    <g class="pet" transform="translate(676 40) scale(13)">
      <g fill="#f4f4f7" stroke="#f4f4f7" stroke-width=".667" stroke-linejoin="miter">
        <g class="top">
          <path d="M6 5h4v1h-4zM4 6h8v2h-8zM3 8h10v4h-10zM4 12h8v2h-8zM6 14h4v1h-4z"/>
          <path class="flag" d="M13 4h1v1h-1zM12 5h1v1h-1z"/>
        </g>
        <path d="M3 14h1v1h-1zM2 15h1v1h-1z"/>
        <path d="M5 15h2v1h-2z"/>
        <path d="M9 15h2v1h-2z"/>
      </g>
      <g fill="#0b0b0d">
        <g class="top">
          <path d="M6 5h4v1h-4zM4 6h8v2h-8zM3 8h10v4h-10zM4 12h8v2h-8zM6 14h4v1h-4z"/>
          <path class="flag" d="M13 4h1v1h-1zM12 5h1v1h-1z"/>
          <path class="eyes" fill="#ffffff" d="M5 9h1v2h-1zM10 9h1v2h-1z"/>
        </g>
        <path d="M3 14h1v1h-1zM2 15h1v1h-1z"/>
        <path d="M5 15h2v1h-2z"/>
        <path d="M9 15h2v1h-2z"/>
      </g>
    </g>
    <g class="panel">
      <rect x="100" y="290" width="760" height="70" rx="17" fill="#000000" fill-opacity=".35"/>
      <rect x="100" y="282" width="760" height="70" rx="17" fill="#171719" stroke="url(#outline)" stroke-width="1.5"/>
      <path d="M124 308L133 317L124 326" stroke="#fafafa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="151" y="324" class="mono" font-size="21" fill="#ededf0">What are we building?</text>
      <rect class="cursor" x="424" y="305" width="2" height="25" rx="1" fill="#ededf0"/>
      <g class="mono" font-size="13" fill="#c4c4cc" text-anchor="middle">
        <rect x="698" y="301" width="52" height="31" rx="7" fill="#222225" stroke="#3f3f46"/>
        <text x="724" y="322">ctrl</text>
        <text x="764" y="322" fill="#777780">+</text>
        <rect x="778" y="301" width="63" height="31" rx="7" fill="#222225" stroke="#3f3f46"/>
        <text x="809.5" y="322">space</text>
      </g>
    </g>
    <text x="52" y="400" class="mono" font-size="13" letter-spacing=".5" fill="#a1a1aa">Your tools. Your providers. Your way of working.</text>
    <text x="908" y="400" class="mono" font-size="12" letter-spacing="1" text-anchor="end" fill="#a1a1aa">macOS / OMP / ACP</text>
  </g>
  <rect x=".5" y=".5" width="959" height="439" rx="20" stroke="#3f3f46"/>
</svg>
