<svg xmlns="http://www.w3.org/2000/svg" width="208" height="208" viewBox="0 1 16 16" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
  <title id="title">Null's pet</title>
  <desc id="description">A small round creature drawn in black squares with a light edge: two eyes, two feet, an antenna and a tail. It moves as it does beside the box in the app: it rests, bobbing and blinking; it walks in place and looks about, as while a reply is under way; and it hops with glad eyes, as when a reply ends. Then it rests again. Motion is disabled for reduced motion.</desc>
  <style>
    .glad { opacity: 0; }
    .all { animation: hop 12.52s steps(1) infinite; }
    .top { animation: bob 12.52s steps(1) infinite; }
    .flag { animation: twitch 12.52s steps(1) infinite; }
    .eyes { animation: blink 12.52s steps(1) infinite, scan 12.52s steps(1) infinite; }
    .left { animation: left-foot 12.52s steps(1) infinite; }
    .right { animation: right-foot 12.52s steps(1) infinite; }
    .open { animation: open-eyes 12.52s steps(1) infinite; }
    .glad { animation: glad-eyes 12.52s steps(1) infinite; }
    @keyframes hop { 84.185% { transform: translateY(-2px); } 85.942% { transform: none; } 87.700% { transform: translateY(-1px); } 89.457% { transform: none; } }
    @keyframes bob { 12.460% { transform: translateY(1px); } 20.767% { transform: none; } 33.227% { transform: translateY(1px); } 41.534% { transform: none; } 44.601% { transform: translateY(1px); } 46.645% { transform: none; } 49.712% { transform: translateY(1px); } 51.757% { transform: none; } 54.824% { transform: translateY(1px); } 56.869% { transform: none; } 59.936% { transform: translateY(1px); } 61.981% { transform: none; } 65.048% { transform: translateY(1px); } 67.093% { transform: none; } 70.160% { transform: translateY(1px); } 72.204% { transform: none; } 75.272% { transform: translateY(1px); } 77.316% { transform: none; } 80.383% { transform: translateY(1px); } 82.428% { transform: none; } }
    @keyframes twitch { 23.962% { transform: translateY(-1px); } 26.038% { transform: none; } }
    @keyframes blink { 7.188% { opacity: 0; } 8.626% { opacity: 1; } 27.157% { opacity: 0; } 28.594% { opacity: 1; } }
    @keyframes scan { 48.690% { transform: translateX(1px); } 51.757% { transform: none; } 58.914% { transform: translateX(-1px); } 61.981% { transform: none; } 69.137% { transform: translateX(1px); } 72.204% { transform: none; } 79.361% { transform: translateX(-1px); } 82.428% { transform: none; } }
    @keyframes left-foot { 44.089% { transform: translateY(-1px); } 46.645% { transform: none; } 49.201% { transform: translateY(-1px); } 51.757% { transform: none; } 54.313% { transform: translateY(-1px); } 56.869% { transform: none; } 59.425% { transform: translateY(-1px); } 61.981% { transform: none; } 64.537% { transform: translateY(-1px); } 67.093% { transform: none; } 69.649% { transform: translateY(-1px); } 72.204% { transform: none; } 74.760% { transform: translateY(-1px); } 77.316% { transform: none; } 79.872% { transform: translateY(-1px); } 82.428% { transform: none; } }
    @keyframes right-foot { 41.534% { transform: translateY(-1px); } 44.089% { transform: none; } 46.645% { transform: translateY(-1px); } 49.201% { transform: none; } 51.757% { transform: translateY(-1px); } 54.313% { transform: none; } 56.869% { transform: translateY(-1px); } 59.425% { transform: none; } 61.981% { transform: translateY(-1px); } 64.537% { transform: none; } 67.093% { transform: translateY(-1px); } 69.649% { transform: none; } 72.204% { transform: translateY(-1px); } 74.760% { transform: none; } 77.316% { transform: translateY(-1px); } 79.872% { transform: none; } }
    @keyframes open-eyes { 82.428% { opacity: 0; } }
    @keyframes glad-eyes { 82.428% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="all">
    <g fill="#f4f4f7" stroke="#f4f4f7" stroke-width=".667" stroke-linejoin="miter">
      <g class="top">
        <path d="M6 5h4v1h-4zM4 6h8v2h-8zM3 8h10v4h-10zM4 12h8v2h-8zM6 14h4v1h-4z"/>
        <path class="flag" d="M13 4h1v1h-1zM12 5h1v1h-1z"/>
      </g>
      <path d="M3 14h1v1h-1zM2 15h1v1h-1z"/>
      <path class="left" d="M5 15h2v1h-2z"/>
      <path class="right" d="M9 15h2v1h-2z"/>
    </g>
    <g fill="#0b0b0d">
      <g class="top">
        <path d="M6 5h4v1h-4zM4 6h8v2h-8zM3 8h10v4h-10zM4 12h8v2h-8zM6 14h4v1h-4z"/>
        <path class="flag" d="M13 4h1v1h-1zM12 5h1v1h-1z"/>
        <g class="eyes" fill="#ffffff">
          <path class="open" d="M5 9h1v2h-1zM10 9h1v2h-1z"/>
          <path class="glad" d="M5 9h1v1h-1zM4 10h1v1h-1zM6 10h1v1h-1zM10 9h1v1h-1zM9 10h1v1h-1zM11 10h1v1h-1z"/>
        </g>
      </g>
      <path d="M3 14h1v1h-1zM2 15h1v1h-1z"/>
      <path class="left" d="M5 15h2v1h-2z"/>
      <path class="right" d="M9 15h2v1h-2z"/>
    </g>
  </g>
</svg>
