<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 344" width="860" height="344" fill="none" role="img" aria-label="Development. $ Mini/Scripts/engine          # once: fetch the Oh-my-pi the build takes in $ cd Mini &amp;&amp; cargo test        # offline unit tests; live ones are ignored $ cargo build                  # local debug binary $ cargo tauri build            # app bundle, no installation Use cargo tauri, not bunx tauri: the latter names a different npm package. cargo test -- --ignored is the harness check: live tests on the carried Oh-my-pi with a stand-in provider, one of which reaches a real provider with a dummy key. NULL_MINI_ENGINE=&lt;path&gt; runs them on another Oh-my-pi, and Mini/Scripts/engine --to &lt;version&gt; moves Null to that version only if they pass. Repository CI checks the Voice frontend and web build, not Mini/.">
  <title>Development. $ Mini/Scripts/engine          # once: fetch the Oh-my-pi the build takes in $ cd Mini &amp;&amp; cargo test        # offline unit tests; live ones are ignored $ cargo build                  # local debug binary $ cargo tauri build            # app bundle, no installation Use cargo tauri, not bunx tauri: the latter names a different npm package. cargo test -- --ignored is the harness check: live tests on the carried Oh-my-pi with a stand-in provider, one of which reaches a real provider with a dummy key. NULL_MINI_ENGINE=&lt;path&gt; runs them on another Oh-my-pi, and Mini/Scripts/engine --to &lt;version&gt; moves Null to that version only if they pass. Repository CI checks the Voice frontend and web build, not Mini/.</title>
