  <text x="24" y="220.0" font-size="12.5" font-weight="700" fill="#3FB950">Warning</text>
  <text x="170.25" y="220.0" font-size="12.5" fill="#C9D1D9">Most endpoints have no authentication, and loopback binding is not an</text>
  <text x="170.25" y="239.0" font-size="12.5" fill="#C9D1D9">authorization layer</text>
