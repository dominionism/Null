  <text x="430.0" y="19.0" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="middle">Optional voice tools</text>
  <text x="24" y="66.0" font-size="12.5" fill="#C9D1D9" font-style="italic">Voicebox is a separate tool the box can use for voice, not part of its text path.</text>
  <text x="24" y="85.0" font-size="12.5" font-weight="700" fill="#3FB950">Voicebox</text>
  <text x="170.25" y="85.0" font-size="12.5" fill="#C9D1D9">Local voice cloning and synthesis, Whisper transcription, dictation, effects,</text>
  <text x="170.25" y="104.0" font-size="12.5" fill="#C9D1D9">stories and MCP speech tools</text>
  <text x="24" y="130.0" font-size="12.5" font-weight="700" fill="#3FB950">Wiring</text>
  <text x="170.25" y="130.0" font-size="12.5" fill="#C9D1D9">OMP can call a voicebox MCP server while that service runs; there is no</text>
  <text x="170.25" y="149.0" font-size="12.5" fill="#C9D1D9">integrated voice-conversation mode yet</text>
  <text x="24" y="175.0" font-size="12.5" font-weight="700" fill="#3FB950">API</text>
  <text x="170.25" y="175.0" font-size="12.5" fill="#C9D1D9">127.0.0.1:17493 for REST and /mcp; narration on 17494; voicebox-mcp is the</text>
