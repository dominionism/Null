<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 325" width="860" height="325" fill="none" role="img" aria-label="Optional voice tools. Voicebox is a separate tool the box can use for voice, not part of its text path. Voicebox: Local voice cloning and synthesis, Whisper transcription, dictation, effects, stories and MCP speech tools Wiring: OMP can call a voicebox MCP server while that service runs; there is no integrated voice-conversation mode yet API: 127.0.0.1:17493 for REST and /mcp; narration on 17494; voicebox-mcp is the stdio-to-HTTP shim Warning: Most endpoints have no authentication, and loopback binding is not an authorization layer $ just setup &amp;&amp; just dev">
  <title>Optional voice tools. Voicebox is a separate tool the box can use for voice, not part of its text path. Voicebox: Local voice cloning and synthesis, Whisper transcription, dictation, effects, stories and MCP speech tools Wiring: OMP can call a voicebox MCP server while that service runs; there is no integrated voice-conversation mode yet API: 127.0.0.1:17493 for REST and /mcp; narration on 17494; voicebox-mcp is the stdio-to-HTTP shim Warning: Most endpoints have no authentication, and loopback binding is not an authorization layer $ just setup &amp;&amp; just dev</title>
  <style>
    text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .rise { animation: rise .35s ease-out both; }
    .fade { animation: fade .4s ease-out both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hold { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .c0 { opacity: 0; transform: translateX(171.6px); animation: c0 1.210s steps(22, end) 0.350s both, hold 1.810s linear both; }
    @keyframes c0 { from { transform: translateX(0); } }
  </style>
