    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hold { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .c0 { opacity: 0; transform: translateX(468.0px); animation: c0 3.300s steps(60, end) 0.350s both, hold 3.900s linear both; }
    @keyframes c0 { from { transform: translateX(0); } }
    .c1 { opacity: 0; transform: translateX(156.0px); animation: c1 1.100s steps(20, end) 4.400s both, hold 5.750s linear both; }
    @keyframes c1 { from { transform: translateX(0); } }
