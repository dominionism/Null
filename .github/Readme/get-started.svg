<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 234" width="860" height="234" fill="none" role="img" aria-label="Get started. macOS 13+ · Rust · Xcode Command Line Tools · Tauri CLI 2. No Node, Bun or Python is needed for the box. $ git clone https://github.com/dominionism/Null.git &amp;&amp; cd Null $ Mini/Scripts/install">
  <title>Get started. macOS 13+ · Rust · Xcode Command Line Tools · Tauri CLI 2. No Node, Bun or Python is needed for the box. $ git clone https://github.com/dominionism/Null.git &amp;&amp; cd Null $ Mini/Scripts/install</title>
  <style>
