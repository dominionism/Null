<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" fill="none" role="img" aria-label="Uninstall. $ curl -fsSL \ $   https://raw.githubusercontent.com/dominionism/Null/main/Mini/Scripts/null \ $   | sh -s uninstall From a clone: Mini/Scripts/uninstall does the same Removes: /Applications/Null.app, and the login item at ~/Library/LaunchAgents/io.github.dominionism.null-mini.plist Left behind: Settings, workspace files and logs, in ~/Library/Application Support/io.github.dominionism.null-mini/ and ~/Library/Logs/Null/, and Null&#x27;s signing identity, in ~/Library/Application Support/Null Signing/, so that a Null installed later is the same app to macOS OMP&#x27;s own sign-ins and conversation history are not removed.">
  <title>Uninstall. $ curl -fsSL \ $   https://raw.githubusercontent.com/dominionism/Null/main/Mini/Scripts/null \ $   | sh -s uninstall From a clone: Mini/Scripts/uninstall does the same Removes: /Applications/Null.app, and the login item at ~/Library/LaunchAgents/io.github.dominionism.null-mini.plist Left behind: Settings, workspace files and logs, in ~/Library/Application Support/io.github.dominionism.null-mini/ and ~/Library/Logs/Null/, and Null&#x27;s signing identity, in ~/Library/Application Support/Null Signing/, so that a Null installed later is the same app to macOS OMP&#x27;s own sign-ins and conversation history are not removed.</title>
