    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hold { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .c0 { opacity: 0; transform: translateX(93.6px); animation: c0 0.660s steps(12, end) 0.350s both, hold 1.260s linear both; }
    @keyframes c0 { from { transform: translateX(0); } }
    .c1 { opacity: 0; transform: translateX(600.6px); animation: c1 4.235s steps(77, end) 1.760s both, hold 6.245s linear both; }
    @keyframes c1 { from { transform: translateX(0); } }
    .c2 { opacity: 0; transform: translateX(148.2px); animation: c2 1.045s steps(19, end) 6.745s both, hold 8.040s linear both; }
    @keyframes c2 { from { transform: translateX(0); } }
  </style>
