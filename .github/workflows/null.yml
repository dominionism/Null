name: Null

# Null's own tests, whenever Null changes: on any branch that is pushed, so that each pushed
# version says whether it works, and on pull requests from forks, which a push here does not cover.
on:
  push:
    paths:
      - "Mini/**"
      - ".github/workflows/null.yml"
  pull_request:
    paths:
      - "Mini/**"
      - ".github/workflows/null.yml"
  workflow_dispatch:

jobs:
  test:
    # A branch of this repository is already tested by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # Null is a macOS app, and the Oh-my-pi it carries is fetched for Apple Silicon.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./Mini -> target"

      - name: Keep the carried Oh-my-pi between runs
        uses: actions/cache@v4
        with:
          path: Mini/Engine
          key: null-engine-${{ hashFiles('Mini/Engine.toml') }}

      # The build takes Oh-my-pi into the app, so nothing compiles without it. The script
      # keeps a file only if its checksum is the one in Mini/Engine.toml.
      - name: Fetch the Oh-my-pi that Null carries
        run: Mini/Scripts/engine

      - name: Unit tests
        working-directory: Mini
        run: cargo test

      # The browser link's bench: every checker tried on a right and a wrong end state of
      # its own, with no model and no Chrome.
      - name: Bench self-tests
        run: python3 -m unittest discover -s Mini/Bench

      # One harness-check question loads Null's copy of the browser link's extension in a
      # Chrome, which only Chrome for Testing allows from the command line. It is kept between
      # runs, and kept at all only if its checksum is the one the bench names.
      - name: Keep Chrome for Testing between runs
        uses: actions/cache@v4
        with:
          path: ~/ChromeForTesting
          key: chrome-for-testing-155.0.8059.79

      - name: Fetch Chrome for Testing
        run: |
          if [ ! -d ~/ChromeForTesting/chrome-mac-arm64 ]; then
            mkdir -p ~/ChromeForTesting
            curl --fail --location --silent --show-error --output ~/ChromeForTesting/chrome.zip \
              https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.79/mac-arm64/chrome-mac-arm64.zip
            echo "e141a7cbf948780bb7d381860bd5a7944c6736f79b9918b9826fccb199d28ea4  $HOME/ChromeForTesting/chrome.zip" | shasum -a 256 -c -
            ditto -x -k ~/ChromeForTesting/chrome.zip ~/ChromeForTesting
            rm ~/ChromeForTesting/chrome.zip
          fi
          echo "NULL_MINI_CHROME=$HOME/ChromeForTesting/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" >> "$GITHUB_ENV"

      # The live checks start the real Oh-my-pi against a stand-in provider. A hosted
      # runner has few cores, so they take turns four at a time.
      - name: Harness check
        working-directory: Mini
        run: cargo test -- --ignored --test-threads=4
