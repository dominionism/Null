<!doctype html>
<!-- Null's box: the whole page.

     Enter sends what you typed to your agent and the reply streams in below.
     /model opens the model list, /backup sets the models to carry on with when
     the one in use stops answering, /usage shows what each provider has left,
     /login signs in to a provider, /harness shows which Oh-my-pi the box runs
     and lets you choose your own, /update moves the built-in one to the newest
     checked version, /attach (or the plus at the end of the row) hands the
     agent a file with the next message, /history (and the button after the
     plus) lists the earlier conversations and opens one again, /pet shows the
     pet or puts it away, /new starts a new conversation, /quit quits the app
     and closes the conversation, Ctrl+C
     stops a reply or, with nothing running, does what /quit does, Esc hides the
     box.

     Nothing is shown but the arrow and the text box until there is something
     to say. The arrow is the status: it pulses while the agent works and turns
     amber while it waits for an answer. The pet, left of the box, is the same
     status with a body. Press and drag anywhere that is not text to move the
     box.

     The page talks to the app through commands (invoke) and hears from it
     through events; see src/harness.rs and src/panel.rs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Null</title>
    <style>
      /* Sizing contract with src/panel.rs. The window is transparent and
         exactly the box plus the room its shadow needs: 8px above, 16px each side,
         24px below (the .box margin). FRAME in the script is top + bottom (32);
         WIDTH on the Rust side is the 584px box plus both sides (616). Every height
         here is a fixed number of pixels so MAX_HEIGHT there can be exact:
         2 border + 42 row + 212 transcript + 26 notice + 32 margins = 314.
         The transcript and the model list stop at 212px (about ten lines of
         transcript) and scroll past that, so the box stays compact however long the
         chat gets. */
      :root {
        --accent: 255, 255, 255;
        --amber: 255, 212, 121;
        --text: #f4f4f7;
        --soft: #dcdce4;
        --dim: #9a9aa6;
        --faint: #777783;
        --red: #ff8078;
        --command: #8ab8ff;
        --line: rgba(255, 255, 255, 0.09);
        /* One typeface throughout: the box is a terminal. */
        --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font: 13px/1.4 var(--mono);
        color: var(--text);
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: rgba(var(--accent), 0.28);
      }

      /* The box is one opaque shape, so its outline is a single smooth curve.
         The edge is a second background that shows only in the 1px border, drawn
         over the box's own fill. A see-through border would sit over whatever is
         behind the window and pick up its detail, which reads as a rough line.
         A half-pixel dark line outside keeps the box apart from light windows, and
         the shadow fits inside the margin instead of being cut off by the window. */
      @property --edge-top {
        syntax: '<color>';
        inherits: false;
        initial-value: #74747c;
      }
      @property --edge-bottom {
        syntax: '<color>';
        inherits: false;
        initial-value: #4c4c53;
      }
      .box {
        --edge-top: #74747c;
        --edge-bottom: #4c4c53;
        --ring: 1px;
        /* The fill's corners are a little rounder than the edge's inner curve (13px)
           would be, which leaves a sliver more edge on each corner. A thin light line
           on a dark ground otherwise looks thinner on a curve than on a straight: the
           half-covered pixels along a curve come out darker than half as bright.
           Measured in the app's web engine, the edge carried 7 to 11% less light on
           the corners at 13px, and is within 2% of the straights at 13.5px. */
        --fill-radius: 13.5px;
        position: relative;
        isolation: isolate;
        margin: 8px 16px 24px;
        border: var(--ring) solid transparent;
        border-radius: 14px;
        background: linear-gradient(180deg, var(--edge-top), var(--edge-bottom)) border-box;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.6),
          0 2px 5px rgba(0, 0, 0, 0.28),
          0 10px 22px -8px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        transition:
          --edge-top 0.18s ease,
          --edge-bottom 0.18s ease;
      }
      /* The fill, drawn over the edge colour so that only the ring shows. */
      .box::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: var(--fill-radius);
        background: linear-gradient(180deg, #28282e, #18181c);
      }
      /* Typing lands here: the edge turns white. */
      .box:focus-within {
        --edge-top: #ffffff;
        --edge-bottom: #d6d6dc;
      }

      /* The pet: Nil, the null sign with eyes and feet. It stands left of the box
         with its middle level with the arrow's tip, and is the arrow's status with
         a body: it rests, works, asks, hops once when a reply ends and sinks when
         one fails. It is drawn on a grid of 16 by 16 at three times its size, and
         every movement is one whole pixel of that grid, never a slide. Black with
         a one-pixel light edge, as the box has, so that it shows on a dark desktop
         as well as on a light one.

         Sizing contract with src/panel.rs. With the pet the box starts 62px in (4px,
         the pet's 48, and 10 between them) where it otherwise starts 16px in, so
         the window is LANE = 46px wider, on its left. The pet's top is 6px down:
         that puts its middle (24) on the row's (8 margin + 1 edge + 21), which is
         where the arrow's tip is. */
      .pet {
        display: none;
        position: absolute;
        top: 6px;
        left: 4px;
        overflow: visible;
        fill: #0b0b0d;
        shape-rendering: crispEdges;
        filter: drop-shadow(1px 0 0 #f4f4f7) drop-shadow(-1px 0 0 #f4f4f7) drop-shadow(0 1px 0 #f4f4f7) drop-shadow(0 -1px 0 #f4f4f7);
      }
      body.with-pet .pet {
        display: block;
      }
      body.with-pet .box {
        margin-left: 62px;
      }
      .pet .eyes {
        fill: #fff;
      }
      /* Three pairs of eyes, one shown: open, glad when a reply has ended, flat
         when one has failed. */
      .pet .glad,
      .pet .flat,
      .pet.done .open,
      .pet.fail .open {
        display: none;
      }
      .pet.done .glad,
      .pet.fail .flat {
        display: inline;
      }
      /* Its eyes take the box's own two signal colours, and look up to ask. */
      .pet.ask .eyes {
        fill: rgb(var(--amber));
        transform: translateY(-1px);
      }
      .pet.fail .eyes {
        fill: var(--red);
      }
      .pet.rest .top {
        animation: pet-bob 2.6s steps(1) infinite;
      }
      .pet.rest .eyes {
        animation: pet-blink 4.4s steps(1) infinite;
      }
      .pet.rest .flag {
        animation: pet-twitch 5.2s steps(1) infinite;
      }
      .pet.work .top {
        animation: pet-bob 0.64s steps(1) infinite;
      }
      .pet.work .left {
        animation: pet-lift 0.64s steps(1) infinite;
      }
      .pet.work .right {
        animation: pet-lift 0.64s steps(1) -0.32s infinite;
      }
      .pet.work .eyes {
        animation: pet-scan 2.56s steps(1) infinite;
      }
      .pet.ask .top {
        animation: pet-bob 1.8s steps(1) infinite;
      }
      .pet.ask .flag {
        animation: pet-lift 0.9s steps(1) infinite;
      }
      /* The two gestures are made once. HOP in the script is the hop's length. */
      .pet.done .all {
        animation: pet-hop 2.2s steps(1);
      }
      .pet.fail .all {
        transform: translateY(1px);
        animation: pet-shake 3.4s steps(1);
      }
      @keyframes pet-bob {
        60% {
          transform: translateY(1px);
        }
      }
      @keyframes pet-blink {
        93% {
          opacity: 0;
        }
        97% {
          opacity: 1;
        }
      }
      @keyframes pet-lift {
        50% {
          transform: translateY(-1px);
        }
      }
      @keyframes pet-twitch {
        90% {
          transform: translateY(-1px);
        }
        95% {
          transform: none;
        }
      }
      @keyframes pet-scan {
        35% {
          transform: translateX(1px);
        }
        50% {
          transform: none;
        }
        85% {
          transform: translateX(-1px);
        }
      }
      @keyframes pet-hop {
        10% {
          transform: translateY(-2px);
        }
        20% {
          transform: none;
        }
        30% {
          transform: translateY(-1px);
        }
        40% {
          transform: none;
        }
      }
      @keyframes pet-shake {
        6% {
          transform: translate(-1px, 1px);
        }
        12% {
          transform: translate(1px, 1px);
        }
        18% {
          transform: translateY(1px);
        }
      }

      .row {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 42px;
        padding: 0 14px;
      }
      /* The arrow is the whole status display: steady when idle, pulsing while
         the agent works, amber while the agent waits for an answer. */
      .caret {
        flex: none;
        width: 10px;
        height: 22px;
        color: rgb(var(--accent));
        transition: color 0.2s ease;
      }
      /* Drawn, so it is the same shape in any font, and as one stroke with round
         ends and a round corner, so it reads as a single mark. */
      .caret svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .caret.working {
        animation: pulse 1.2s ease-in-out infinite;
      }
      .caret.asking {
        color: rgb(var(--amber));
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      input,
      #ruler {
        font: 400 13.5px/22px var(--mono);
      }
      input {
        flex: 1;
        min-width: 0;
        /* One 22px line, centred by the row and not moved from there. The engine
           draws the insertion point (the blinking bar) centred in the line, 16px
           tall, the face's 13 up and 3 down, so its middle is level with the
           arrow's tip: measured in the app's web engine at 1x and 2x, both are on
           the row's middle to within 0.01px, in an empty field and a typed one.
           Letters sit lower in the line than the bar does: capitals are centred
           0.25px below the tip and small letters 1.4px below. Lifting the field
           to split that moves the bar off the tip by as much: one pixel up, as it
           once was, put the bar a pixel above it, and half a pixel is drawn
           unevenly at 1x, where the bar of an empty field comes out a pixel
           shorter than that of a typed one. */
        height: 22px;
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        caret-color: rgb(var(--accent));
        cursor: text;
        /* Said outright: the page as a whole is not selectable, and a field that
           picks that up cannot be typed in. */
        user-select: text;
        -webkit-user-select: text;
      }
      /* One of the box's own commands (/model, /login, /new, /quit), as it is typed. */
      input.command {
        color: var(--command);
      }
      /* The row's buttons: quiet marks at its right-hand end, drawn like the arrow. */
      .tool {
        flex: none;
        width: 22px;
        height: 22px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        transition:
          color 0.12s ease,
          background-color 0.12s ease;
      }
      .tool:hover,
      .tool.on {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      .tool svg {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Never seen: measures where the typed text ends, so the unused part of the
         field can be used to move the box. */
      #ruler {
        position: absolute;
        top: 0;
        left: 0;
        visibility: hidden;
        pointer-events: none;
        white-space: pre;
      }
      #notice {
        display: none;
        box-sizing: border-box;
        height: 26px;
        padding: 0 14px 0 33px;
        font: 11px/18px var(--mono);
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* The transcript and the model list share the space under the row. */
      #out,
      #pick {
        display: none;
        box-sizing: border-box;
        border-top: 1px solid var(--line);
        overflow-y: auto;
      }
      #out::-webkit-scrollbar,
      #pick::-webkit-scrollbar {
        width: 10px;
      }
      #out::-webkit-scrollbar-thumb,
      #pick::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.2);
        background-clip: padding-box;
      }
      /* One reading edge. Everything in the transcript starts 33px in, which is
         where the typed text starts in the field above (14px + the 19px gutter),
         and nothing starts before it: no box with an edge of its own to the left,
         no chip around a word, no line down the left side. The one thing in the
         gutter is the null sign beside the owner's message, under the field's arrow. */
      #out {
        position: relative;
        max-height: 212px;
        padding: 12px 12px 14px 14px;
        font: 12.5px/19px var(--mono);
        color: var(--soft);
        cursor: auto;
        user-select: text;
        -webkit-user-select: text;
      }
      /* There is more below than the box shows. */
      #out.more {
        -webkit-mask-image: linear-gradient(#000 calc(100% - 26px), transparent);
        mask-image: linear-gradient(#000 calc(100% - 26px), transparent);
      }
      #out > div {
        margin-left: 19px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #out > .you {
        display: grid;
        grid-template-columns: 19px minmax(0, 1fr);
        margin: 16px 0 0;
        color: rgb(var(--accent));
      }
      #out > .you:first-child {
        margin-top: 0;
      }
      #out > .you + .reply {
        margin-top: 3px;
      }
      /* The null sign, the sign of the app's name. Drawn, so that it is the same
         shape in any typeface, and not the arrow: that is the field's. */
      .you .mark {
        height: 19px;
        color: var(--dim);
      }
      .you .mark svg {
        display: block;
        margin-top: 4px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.3;
        stroke-linecap: round;
      }
      .note {
        color: var(--dim);
        font-style: italic;
      }

      /* What the agent did to get its answer: one quiet line, which opens on a
         click. While it works only its current step shows. A step that failed
         stays in view. */
      .steps {
        margin-top: 3px;
        margin-bottom: 9px;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      .steps .sum {
        display: none;
        cursor: pointer;
      }
      .steps.folded .sum {
        display: block;
      }
      .steps.running .each > div:not(:last-child):not(.failed),
      .steps.folded:not(.open) .each > div:not(.failed) {
        display: none;
      }
      .steps .failed {
        color: var(--red);
      }

      /* A reply, drawn as its parts. Until its layout has come back from the app
         it is plain text, so that no word waits to be seen. */
      .reply.drawn {
        white-space: normal;
        overflow-wrap: break-word;
      }
      .reply.drawn > :last-child {
        margin-bottom: 0;
      }
      .reply p,
      .reply pre,
      .reply table {
        margin: 0;
      }
      .reply p,
      .reply .list,
      .reply .quote {
        margin-bottom: 9px;
      }
      .reply .h {
        margin-bottom: 5px;
        color: #fff;
        font: 600 13px/19px var(--mono);
      }
      .reply .h.minor {
        font-size: 12.5px;
      }
      .reply strong {
        color: #fff;
        font-weight: 600;
      }
      /* A word of code is brighter and has nothing around it: a chip would push
         its word in from the edge whenever it began a line. */
      .reply code {
        color: #fff;
        font: inherit;
      }
      /* A list's marks stand on the edge; its words hang beside them. */
      .reply .item {
        display: grid;
        grid-template-columns: var(--marks, 3ch) minmax(0, 1fr);
      }
      .reply .item + .item {
        margin-top: 2px;
      }
      .reply .item > .n {
        color: var(--faint);
      }
      .reply .item > .body > p,
      .reply .item > .body > .list {
        margin-bottom: 4px;
      }
      .reply .item > .body > :last-child,
      .reply .quote > :last-child {
        margin-bottom: 0;
      }
      .reply .quote {
        color: var(--dim);
      }
      .reply .rule {
        height: 1px;
        margin: 9px 0;
        background: var(--line);
      }
      /* Code, diagrams and tables are never wrapped, and have nothing around
         them: brighter type and space set them off. One too wide for the box is
         moved sideways, with its cut end faded to say there is more. */
      .reply .scrolls {
        margin: 2px 0 11px;
        overflow-x: auto;
      }
      .reply .scrolls::-webkit-scrollbar {
        height: 0;
      }
      .reply .scrolls.wide:not(.end) {
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent);
        mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent);
      }
      .reply pre {
        color: #fff;
        font: 12px/18px var(--mono);
        white-space: pre;
      }
      .reply pre.drawing {
        color: var(--text);
        line-height: 1.24;
      }
      /* A line-drawing character draws its line down the middle of its own width.
         A drawing whose lines all begin with one is moved left by half a
         character, so that the frame it draws stands on the reading edge. */
      .reply pre .art {
        display: inline-block;
        margin-left: calc(0.5px - 0.5ch);
      }
      .reply table {
        border-collapse: collapse;
        font-size: 12px;
        white-space: nowrap;
      }
      .reply th {
        padding: 0 16px 3px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--faint);
        font: 600 10px/16px var(--mono);
        letter-spacing: 0.08em;
        text-align: left;
        text-transform: uppercase;
      }
      .reply td {
        padding: 3px 16px 3px 0;
        border-bottom: 1px solid var(--line);
      }
      .reply th:last-child,
      .reply td:last-child {
        padding-right: 0;
      }
      /* What the harness says while it signs someone in, and the pages it points to. */
      .step {
        color: var(--dim);
      }
      .link {
        color: var(--command);
        text-decoration: underline;
        cursor: pointer;
      }
      .error {
        color: var(--red);
      }
      /* The agent's question stands on the edge like everything else. */
      #out > .ask {
        margin-top: 6px;
        margin-bottom: 6px;
        color: rgb(var(--amber));
      }
      /* The choices sit side by side under the question. */
      .ask br ~ br {
        display: none;
      }
      .ask button {
        margin: 6px 6px 0 0;
        padding: 1px 9px;
        border: 1px solid rgba(var(--amber), 0.4);
        border-radius: 6px;
        background: rgba(var(--amber), 0.06);
        color: inherit;
        font: inherit;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition: background-color 0.12s ease;
      }
      .ask button:not(:disabled):hover {
        background: rgba(var(--amber), 0.18);
      }
      .ask button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      #pick {
        max-height: 212px;
        padding: 6px;
        scroll-padding: 6px; /* the chosen row keeps clear of the edge when keys scroll to it */
        font: 12.5px/19px var(--mono);
        color: var(--soft);
      }
      .provider {
        margin-top: 8px;
        padding: 0 12px;
        color: var(--faint);
        font: 600 10px/18px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .provider:first-child {
        margin-top: 0;
      }
      .option {
        padding: 2px 12px;
        border-radius: 7px;
        cursor: pointer;
        white-space: pre;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .option:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .option.selected {
        background: rgba(var(--accent), 0.15);
        color: #fff;
      }
      .option .id {
        color: var(--dim);
      }
      /* A model whose provider has nothing left for now. */
      .option.spent {
        opacity: 0.4;
      }
      /* /usage: one row a limit, in columns: its name, how much is used, when it
         starts over. The words are the harness's own. */
      .left {
        display: grid;
        grid-template-columns: 19ch 11ch minmax(0, 1fr);
        padding: 2px 12px;
        white-space: pre;
      }
      .left > span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .left.spent,
      .left.none {
        color: var(--dim);
      }
      .left.none {
        display: block;
      }
      /* The provider's own words, when it answered in place of the model. */
      .reply.failed,
      .reply.failed .h,
      .reply.failed strong,
      .reply.failed code,
      .reply.failed pre {
        color: var(--red);
      }

      /* ── History ──
         An earlier conversation in the list: what it was about, and at the row's
         end, in dim type, where it works and when it was last used. */
      .option.past {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 2ch;
      }
      .option.past > span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .option.past > .where {
        max-width: 30ch;
        text-align: right;
      }

      /* ── Attached files ────────────────────────────────────────────────
         What goes with the next message stands on the notice line, on the
         reading edge, until it is sent. A name there is pressed to take it
         off, and is struck through under the pointer to say so. Under the
         owner's message, what went with it is a dim line on the same edge. In
         the list, the folder being shown is written as it is and not in
         capitals: a name is data. */
      #notice .off {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--soft);
        font: inherit;
        cursor: pointer;
      }
      #notice .off:hover {
        color: var(--text);
        text-decoration: line-through;
      }
      #out > .you > .with {
        grid-column: 2;
        margin-bottom: 5px;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      .provider.where {
        font: 11px/18px var(--mono);
        letter-spacing: 0;
        text-transform: none;
        white-space: pre;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .caret.working {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <!-- The pet, a pixel to a square: its round body, the stroke of the null sign
         as an antenna (.flag) above and a tail below, three pairs of eyes, and two
         feet. The grid's rows 2 to 18 are shown, so that its middle is the picture's. -->
    <svg class="pet rest" id="pet" viewBox="0 2 16 16" width="48" height="48" aria-hidden="true">
      <g class="all">
        <g class="top">
          <path d="M6 5h4v1h-4zM4 6h8v2h-8zM3 8h10v4h-10zM4 12h8v2h-8zM6 14h4v1h-4z" />
          <path class="flag" d="M13 4h1v1h-1zM12 5h1v1h-1z" />
          <g class="eyes">
            <path class="open" d="M5 9h1v2h-1zM10 9h1v2h-1z" />
            <path class="glad" d="M5 9h1v1h-1zM4 10h1v1h-1zM6 10h1v1h-1zM10 9h1v1h-1zM9 10h1v1h-1zM11 10h1v1h-1z" />
            <path class="flat" d="M4 10h2v1h-2zM10 10h2v1h-2z" />
          </g>
        </g>
        <path d="M3 14h1v1h-1zM2 15h1v1h-1z" />
        <path class="left" d="M5 15h2v1h-2z" />
        <path class="right" d="M9 15h2v1h-2z" />
      </g>
    </svg>
    <div class="box" id="box">
      <div class="row">
        <span class="caret" id="caret" aria-hidden="true"
          ><svg viewBox="0 0 10 22" width="10" height="22"><path d="M3 7l4 4-4 4" /></svg
        ></span>
        <input id="q" autofocus spellcheck="false" />
        <button class="tool" id="attach" type="button" tabindex="-1" aria-label="attach a file">
          <svg viewBox="0 0 22 22" width="22" height="22"><path d="M11 6.5v9M6.5 11h9" /></svg>
        </button>
        <button class="tool" id="history" type="button" tabindex="-1" aria-label="earlier conversations">
          <svg viewBox="0 0 22 22" width="22" height="22"><path d="M6.2 6.9a6.3 6.3 0 1 1-1.4 5.2M5.6 4.2v3h3M11 7.7V11l2.3 1.4" /></svg>
        </button>
      </div>
      <div id="pick"></div>
      <div id="out"></div>
      <div id="notice"></div>
    </div>
    <span id="ruler" aria-hidden="true"></span>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const input = document.getElementById('q');
      const out = document.getElementById('out');
      const noticeLine = document.getElementById('notice');
      const caret = document.getElementById('caret');
      const box = document.getElementById('box');
      const pick = document.getElementById('pick');
      const ruler = document.getElementById('ruler');

      let lastSeq = 0; // the number of the last event shown
      let busy = false;
      let lastPrompt = '';
      let reply = null; // { element, text, drawn, busy, again }: the answer that is streaming in
      let steps = null; // { element, sum, each }: the tool steps of the reply in progress
      let anchor = null; // the owner's latest message: held at the top once the reply outgrows the box
      let following = true; // false once the owner has scrolled for themselves
      let pendingAsk = null; // { requestId, options, element }
      let picker = null; // { models, current, shown, index, backups, spent, left } while a list is open; usage or harness says which other list
      const running = new Set(); // the tool calls under way
      let signin = null; // { stage: 'choose' | 'steps', providers, shown, index, before, cancelled } during /login
      let welcome = null; // { freely } from the first opening until its sign-in is over
      const toolLines = new Map(); // call id → { row, block }

      // ── Display ────────────────────────────────────────────────────────

      // The window is the box plus the margin its shadow sits in: 8px above and
      // 24px below. Keep in step with the .box margin and src/panel.rs.
      const FRAME = 32;
      let lastHeight = 0;
      const fit = () => {
        requestAnimationFrame(() => {
          const height = Math.ceil(box.getBoundingClientRect().height) + FRAME;
          if (height !== lastHeight) {
            lastHeight = height;
            invoke('resize', { height });
          }
        });
      };

      // Where the view rests. It follows a reply only until the owner's message
      // has reached the top, and holds it there: a long answer is then shown from
      // its beginning, with the rest below. Once the owner scrolls, it stays put.
      const place = () => {
        const end = out.scrollHeight - out.clientHeight;
        if (following) {
          const top = anchor && anchor.isConnected ? anchor.offsetTop - 12 : end;
          out.scrollTop = Math.min(top, end);
        }
        out.classList.toggle('more', out.scrollTop < end - 2);
      };

      // The owner reading for themselves: the view stops following. Moving a wide
      // block sideways is not that.
      out.addEventListener(
        'wheel',
        (event) => {
          if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) following = false;
        },
        { passive: true },
      );
      out.addEventListener('scroll', () => out.classList.toggle('more', out.scrollTop < out.scrollHeight - out.clientHeight - 2));

      const add = (element) => {
        if (!picker) out.style.display = 'block'; // behind an open list until the list is put away
        out.appendChild(element);
        place();
        fit();
        return element;
      };

      const el = (tag, className, ...children) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.append(...children);
        return element;
      };

      const line = (className, text) => {
        // Outside a reply, what the box says has to be seen: the view goes to it.
        if (!busy) {
          anchor = null;
          following = true;
        }
        return add(el('div', className, text));
      };

      const SVG = 'http://www.w3.org/2000/svg';
      const nullSign = () => {
        const sign = document.createElementNS(SVG, 'svg');
        sign.setAttribute('viewBox', '0 0 10 11');
        sign.setAttribute('width', '10');
        sign.setAttribute('height', '11');
        const ring = document.createElementNS(SVG, 'circle');
        ring.setAttribute('cx', '5');
        ring.setAttribute('cy', '5.5');
        ring.setAttribute('r', '3.4');
        const stroke = document.createElementNS(SVG, 'path');
        stroke.setAttribute('d', 'M8.3 1.3L1.7 9.7');
        sign.append(ring, stroke);
        return sign;
      };

      // ── A reply, drawn as its parts ────────────────────────────────────
      //
      // The app reads the reply's Markdown into a tree (src/markdown.rs). Every
      // element here is made by the page and given text: nothing a model writes
      // is ever put on the page as HTML.

      const inlines = (parent, parts) => {
        for (const part of parts || []) parent.append(inline(part));
        return parent;
      };

      const inline = (part) => {
        switch (part.kind) {
          case 'strong':
            return inlines(el('strong'), part.inlines);
          case 'emphasis':
            return inlines(el('em'), part.inlines);
          case 'strike':
            return inlines(el('s'), part.inlines);
          case 'code':
            return el('code', '', part.text);
          case 'break':
            return el('br');
          case 'link': {
            const web = /^https?:\/\//.test(part.url);
            const link = inlines(el('span', web ? 'link' : ''), part.inlines);
            if (web) link.addEventListener('click', () => invoke('open_url', { url: part.url }).catch(() => {}));
            return link;
          }
          default:
            return document.createTextNode(part.text || '');
        }
      };

      const DRAWN = /[\u2500-\u257f]/; // the line-drawing characters
      const block = (part) => {
        switch (part.kind) {
          case 'heading':
            return inlines(el('div', part.level > 2 ? 'h minor' : 'h'), part.inlines);
          case 'list': {
            const list = el('div', 'list');
            const widest = String(part.start + part.items.length - 1).length;
            list.style.setProperty('--marks', `${part.ordered ? widest + 2 : 2}ch`);
            part.items.forEach((item, index) => {
              const mark = item.checked === true ? '✓' : item.checked === false ? '○' : part.ordered ? `${part.start + index}.` : '•';
              list.append(el('div', 'item', el('span', 'n', mark), el('div', 'body', ...item.blocks.map(block))));
            });
            return list;
          }
          case 'code': {
            const lines = part.text.split('\n').filter(Boolean);
            const drawing = DRAWN.test(part.text);
            const framed = drawing && lines.every((text) => /^[\u2500-\u257f ]/.test(text)) && lines.some((text) => DRAWN.test(text[0]));
            return el('pre', drawing ? 'scrolls drawing' : 'scrolls', framed ? el('span', 'art', part.text) : part.text);
          }
          case 'quote':
            return el('div', 'quote', ...part.blocks.map(block));
          case 'table': {
            const cell = (tag, parts, index) => {
              const made = inlines(el(tag), parts);
              if (part.align[index]) made.style.textAlign = part.align[index];
              return made;
            };
            const head = el('tr', '', ...part.head.map((parts, index) => cell('th', parts, index)));
            const rows = part.rows.map((row) => el('tr', '', ...row.map((parts, index) => cell('td', parts, index))));
            return el('div', 'scrolls', el('table', '', el('thead', '', head), el('tbody', '', ...rows)));
          }
          case 'rule':
            return el('div', 'rule');
          default:
            return inlines(el('p'), part.inlines);
        }
      };

      // A block a little too wide for the box is set in smaller type, no smaller
      // than 10px, before it has to be moved sideways.
      const fitBlocks = (root) => {
        for (const box of root.querySelectorAll('.scrolls')) {
          if (!box.clientWidth) continue; // not on screen now; done again when it is
          if (box.tagName === 'PRE') {
            box.style.fontSize = '';
            let size = 12;
            while (box.scrollWidth > box.clientWidth && size > 10) {
              size -= 0.5;
              box.style.fontSize = `${size}px`;
            }
          }
          const atEnd = () => box.scrollLeft + box.clientWidth >= box.scrollWidth - 1;
          box.classList.toggle('wide', box.scrollWidth > box.clientWidth + 1);
          box.classList.toggle('end', atEnd());
          box.onscroll = () => box.classList.toggle('end', atEnd());
        }
      };

      const drawReply = (target, blocks) => {
        target.drawn = true;
        target.element.classList.add('drawn');
        target.element.replaceChildren(...blocks.map(block));
        fitBlocks(target.element);
        place();
        fit();
      };

      // Ask the app for the layout of what has arrived. One asking at a time: text
      // that arrives meanwhile is laid out by the next, so the last word is drawn.
      const layoutSoon = (target) => {
        if (target.busy) {
          target.again = true;
          return;
        }
        target.busy = true;
        invoke('layout', { text: target.text })
          .then((blocks) => {
            if (Array.isArray(blocks)) drawReply(target, blocks);
          })
          .catch(() => {}) // the plain text is already there
          .finally(() => {
            target.busy = false;
            if (target.again) {
              target.again = false;
              layoutSoon(target);
            }
          });
      };

      // ── Tool steps ─────────────────────────────────────────────────────

      const summarise = (stepsBlock) => {
        const rows = [...stepsBlock.each.children];
        if (stepsBlock.element.classList.contains('running') || rows.length < 2) return;
        const failed = rows.filter((row) => row.classList.contains('failed')).length;
        stepsBlock.element.classList.add('folded');
        stepsBlock.sum.textContent = failed ? `${rows.length} steps, ${failed} failed` : `✓ ${rows.length} steps`;
      };

      // The steps so far are over: the answer has begun, or the reply has ended.
      const foldSteps = () => {
        if (!steps) return;
        const done = steps;
        steps = null;
        done.element.classList.remove('running');
        summarise(done);
        place();
        fit();
      };

      const step = (event) => {
        let known = toolLines.get(event.call_id);
        if (!known) {
          if (!steps) {
            const sum = el('div', 'sum');
            const each = el('div', 'each');
            const element = el('div', 'steps running', sum, each);
            sum.addEventListener('click', () => {
              element.classList.toggle('open');
              place();
              fit();
            });
            steps = { element, sum, each };
            add(element);
          }
          known = { row: steps.each.appendChild(el('div')), block: steps };
          toolLines.set(event.call_id, known);
        }
        known.row.className = event.status === 'failed' ? 'failed' : '';
        known.row.textContent = `${toolMark[event.status] || '…'} ${event.title}`;
        summarise(known.block);
        place();
        fit();
      };

      // ── The pet ────────────────────────────────────────────────────────
      //
      // It follows the arrow: resting, working, asking. When a reply ends it hops
      // once, and when one fails it sinks and stays sunk until the arrow next
      // changes. /pet shows it or puts it away, and the app remembers which.

      const pet = document.getElementById('pet');
      const HOP = 2200; // as long as the hop in the style above
      let petShown = false; // until the app has said
      let hopTimer = null;
      let noAnswer = false; // the reply that is ending brought the provider's refusal
      const mood = (name) => {
        clearTimeout(hopTimer);
        pet.setAttribute('class', `pet ${name}`);
        if (name === 'done') hopTimer = setTimeout(() => mood('rest'), HOP);
      };
      const showPet = (shown) => {
        petShown = !!shown;
        document.body.classList.toggle('with-pet', petShown);
      };

      // '' when idle, 'working' while the agent works, 'asking' while it waits for an answer.
      const mark = (state) => {
        const before = caret.className;
        caret.className = state ? `caret ${state}` : 'caret';
        // The pet moves when the arrow changes. Told again that nothing is
        // running, it keeps the gesture it is making.
        if (caret.className !== before) mood(state === 'working' ? 'work' : state === 'asking' ? 'ask' : 'rest');
      };

      // The box's own commands take their own colour as they are typed, so it is
      // plain they will be carried out here. Anything else that starts with "/"
      // stays white: it goes to the agent as typed.
      const COMMANDS = ['/model', '/backup', '/usage', '/login', '/harness', '/update', '/attach', '/history', '/pet', '/new', '/quit'];
      const tint = () => {
        const text = input.value;
        const command =
          !picker &&
          !signin &&
          text.startsWith('/') &&
          (text.startsWith('/model ') || text.startsWith('/backup ') || text.startsWith('/attach ') || text.startsWith('/history ') || COMMANDS.some((name) => name.startsWith(text)));
        input.classList.toggle('command', command);
      };

      // Words appear only for something the user has to know, and then go away.
      let noticeTimer = null;
      const notice = (text, stay = false) => {
        noticeLine.textContent = text;
        noticeLine.style.display = 'block';
        clearTimeout(noticeTimer);
        if (!stay) {
          noticeTimer = setTimeout(() => {
            noticeLine.style.display = 'none';
            fit();
            restAttached(); // what is attached has the line when nothing newer does
          }, 4000);
        }
        fit();
      };

      const unnotice = () => {
        clearTimeout(noticeTimer);
        noticeLine.style.display = 'none';
        fit();
        restAttached();
      };

      // The harness tries a provider that is slow to answer again and again, and
      // says nothing while it does. After a while the box says that it is waiting.
      const QUIET = 20000;
      let quietTimer = null;
      let waitingSaid = false;
      const watchQuiet = () => {
        clearTimeout(quietTimer);
        if (waitingSaid) {
          waitingSaid = false;
          unnotice();
        }
        if (!busy) return;
        quietTimer = setTimeout(() => {
          if (!busy || running.size || pendingAsk) return;
          waitingSaid = true;
          notice('still waiting on the provider. ctrl+c stops it', true);
        }, QUIET);
      };

      const toolMark = { pending: '…', in_progress: '…', completed: '✓', failed: '✗' };

      // ── Events from the app ────────────────────────────────────────────

      const show = (event) => {
        switch (event.type) {
          case 'user_message': {
            reply = null;
            foldSteps();
            following = true;
            anchor = add(el('div', 'you', el('span', 'mark', nullSign()), el('div', 'text', event.text)));
            wentWith(anchor, event.files);
            place();
            break;
          }
          case 'text_delta':
            if (event.thinking) {
              mark('working');
              break;
            }
            if (!reply) {
              foldSteps();
              reply = { element: add(el('div', 'reply')), text: '', drawn: false, busy: false, again: false };
            }
            reply.text += event.text;
            if (!reply.drawn) reply.element.textContent = reply.text;
            layoutSoon(reply);
            place();
            fit();
            break;
          case 'tool_activity':
            reply = null;
            step(event);
            if (event.status === 'completed' || event.status === 'failed') running.delete(event.call_id);
            else running.add(event.call_id);
            mark('working');
            break;
          case 'approval_request': {
            reply = null;
            const element = line('ask', `Your agent asks: ${event.title}`);
            event.options.forEach((option, index) => {
              const button = document.createElement('button');
              button.textContent = `${index + 1} ${option.label}`;
              button.addEventListener('click', () => answer(option.option_id));
              element.appendChild(document.createElement('br'));
              element.appendChild(button);
            });
            pendingAsk = { requestId: event.request_id, options: event.options, element };
            mark('asking');
            fit();
            break;
          }
          case 'status_change':
            if (event.status === 'running') {
              busy = true;
              mark('working');
            }
            break;
          case 'model_changed':
            reply = null;
            line('note', `now on ${event.model}`);
            break;
          case 'model_switched':
            // The harness moved to a backup by itself. A switch is never silent.
            reply = null;
            line('note', event.from ? `${event.from} did not answer. now on ${event.to}` : `now on ${event.to}`);
            break;
          case 'reply_failed':
            // What came back is the provider's refusal, not the model's answer.
            noAnswer = true;
            if (reply) reply.element.classList.add('failed');
            reply = null;
            line('note', 'no answer from the provider. /model picks another model');
            break;
          case 'message_done':
            reply = null;
            foldSteps();
            if (event.stop_reason === 'cancelled') line('note', 'stopped');
            if (event.stop_reason === 'truncated') line('note', 'the reply was cut short');
            if (event.stop_reason === 'refused') line('note', 'the model refused');
            break;
          case 'error':
            reply = null;
            foldSteps();
            line('error', `error: ${event.message}${event.details ? `\n${event.details}` : ''}`);
            break;
          case 'conversation_opened':
            showEarlier(event);
            break;
        }
        // Either of these ends the reply.
        if (event.type === 'message_done' || event.type === 'error') {
          busy = false;
          pendingAsk = null;
          running.clear();
          mark('');
          // How it ended, in the pet's own way. A reply the owner stopped ends quietly.
          if (event.type === 'error' || noAnswer || event.stop_reason === 'refused') mood('fail');
          else if (event.stop_reason !== 'cancelled') mood('done');
          noAnswer = false;
        }
        watchQuiet();
      };

      // ── Talking to the app ─────────────────────────────────────────────

      // Each event carries a running number, so one that arrives twice (once
      // live, once while catching up) is shown once.
      const apply = (item) => {
        if (item.seq <= lastSeq) return;
        lastSeq = item.seq;
        show(item.event);
      };

      // Live events are held back while a catch-up is in flight, so that they
      // are shown after the older ones it brings.
      let held = null;
      listen('mini:event', (message) => {
        if (held) held.push(message.payload);
        else apply(message.payload);
      });

      // Everything that happened while the page was not listening: before it
      // loaded, or while the box was hidden.
      const catchUp = async () => {
        if (held) return;
        held = [];
        try {
          const snapshot = await invoke('events_since', { after: lastSeq });
          snapshot.events.forEach(apply);
          busy = snapshot.busy;
          watchQuiet();
          if (!busy && !picker) mark('');
        } catch (error) {
          line('error', `could not reach the app: ${error}`);
        } finally {
          const waiting = held;
          held = null;
          waiting.forEach(apply);
        }
      };

      // ── Choosing a model ───────────────────────────────────────────────

      // The same list serves /model and /backup. For /backup the models chosen
      // so far come first, numbered in the order they will be tried.
      const drawPicker = () => {
        const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
        const matching = picker.models.filter((model) => {
          const haystack = `${model.id} ${model.label}`.toLowerCase();
          return words.every((word) => haystack.includes(word));
        });
        const order = picker.backups || [];
        const place = (model) => order.indexOf(model.id);
        const chosen = matching.filter((model) => place(model) >= 0).sort((a, b) => place(a) - place(b));
        picker.shown = chosen.concat(matching.filter((model) => place(model) < 0));
        picker.index = Math.min(picker.index, Math.max(picker.shown.length - 1, 0));
        pick.textContent = '';
        let provider = null;
        picker.shown.forEach((model, index) => {
          const group = place(model) >= 0 ? 'backups, in order' : model.provider || 'models';
          const spent = picker.spent.has(model.id.split('/')[0]);
          if (group !== provider) {
            provider = group;
            const heading = document.createElement('div');
            heading.className = 'provider';
            const left = place(model) < 0 && picker.left.get(model.id.split('/')[0]);
            heading.textContent = left ? `${group} · ${left}` : group;
            pick.appendChild(heading);
          }
          const row = document.createElement('div');
          row.className = `option${index === picker.index ? ' selected' : ''}${spent ? ' spent' : ''}`;
          const name = document.createElement('span');
          const lead = picker.backups ? (place(model) >= 0 ? `${place(model) + 1} ` : '  ') : model.id === picker.current ? '● ' : '  ';
          name.textContent = `${lead}${model.label} `;
          const id = document.createElement('span');
          id.className = 'id';
          id.textContent = model.id;
          row.appendChild(name);
          row.appendChild(id);
          row.addEventListener('click', () => chooseModel(model));
          pick.appendChild(row);
          if (index === picker.index && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
        });
        if (!picker.shown.length) {
          const none = document.createElement('div');
          none.className = 'provider';
          none.textContent = 'no model matches';
          pick.appendChild(none);
        }
        fit();
      };

      const closePicker = () => {
        const { backups, saved, harness } = picker;
        picker = null;
        if (backups && backups.join() !== saved.join()) saveBackups(backups);
        if (harness) unnotice();
        pick.style.display = 'none';
        pick.textContent = '';
        if (out.textContent) {
          out.style.display = 'block';
          fitBlocks(out);
          place();
        }
        input.value = '';
        tint();
        mark(busy ? 'working' : '');
        fit();
        filesClosed();
      };

      // ── What is left ───────────────────────────────────────────────────
      //
      // The harness knows how much of each provider's limits is used and when they
      // start over. The box shows that in the harness's own words for each limit,
      // and only when asked: under /usage, and beside the names in the model list.

      const percent = (share) => `${Math.round(share * 100)}%`;

      // When a limit starts over, said briefly: the time if it is soon, the day
      // if it is this week, the date after that.
      const resets = (at) => {
        if (!at) return '';
        const when = new Date(at);
        const hours = (when - Date.now()) / 3600000;
        if (hours <= 0) return '';
        const time = when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase();
        if (hours < 20) return `resets ${time}`;
        if (hours < 144) return `resets ${when.toLocaleDateString([], { weekday: 'short' })} ${time}`;
        return `resets ${when.toLocaleDateString([], { month: 'short', day: 'numeric' })}`;
      };

      // What is left on a provider, in a few words: its tightest limit.
      const leftOn = (state) => {
        const whole = state.limits.filter((limit) => limit.whole_provider && limit.used !== null);
        if (state.limit_reached) {
          const gone = whole.filter((limit) => limit.status === 'exhausted' && limit.resets_at).sort((a, b) => b.resets_at - a.resets_at)[0];
          const back = gone ? resets(gone.resets_at) : '';
          return back ? `nothing left, ${back}` : 'nothing left for now';
        }
        if (!whole.length) return '';
        const tightest = whole.reduce((a, b) => (b.used > a.used ? b : a));
        return `${percent(Math.max(0, 1 - tightest.used))} left`;
      };

      const openUsage = async () => {
        if (picker || signin) return;
        mark('working');
        let states;
        try {
          states = await invoke('providers', { fresh: true });
        } catch (error) {
          line('error', `could not read what is left: ${error}`);
          mark(busy ? 'working' : '');
          return;
        }
        mark(busy ? 'working' : '');
        picker = { usage: true, models: [], current: null, shown: [], index: 0, backups: null, saved: [], spent: new Set(), left: new Map() };
        out.style.display = 'none';
        pick.style.display = 'block';
        pick.textContent = '';
        input.value = '';
        tint();
        for (const state of states) {
          pick.append(el('div', 'provider', state.provider));
          if (!state.reported || !state.limits.length) {
            pick.append(el('div', 'left none', '  no usage report'));
            continue;
          }
          for (const limit of state.limits) {
            const gone = limit.status === 'exhausted';
            const used = gone ? 'used up' : limit.used === null ? '' : `${percent(limit.used)} used`;
            pick.append(el('div', gone ? 'left spent' : 'left', el('span', '', `  ${limit.label}`), el('span', '', used), el('span', '', resets(limit.resets_at))));
          }
        }
        if (!states.length) pick.append(el('div', 'provider', 'no provider is signed in'));
        fit();
      };

      const saveBackups = async (ids) => {
        try {
          const order = await invoke('set_backups', { ids });
          line('note', order.length ? `backups: ${order.join(', then ')}` : 'no backups');
        } catch (error) {
          line('error', `could not set the backups: ${error}`);
        }
      };

      // `backups` is true for /backup: the list then sets the backup order.
      const openPicker = async (filter = '', backups = false) => {
        if (picker) return;
        if (busy) {
          notice(`stop the reply with ctrl+c before ${backups ? 'changing the backups' : 'switching models'}`);
          return;
        }
        mark('working');
        let listed;
        let order = null;
        try {
          listed = await invoke('models');
          if (backups) order = await invoke('backups');
        } catch (error) {
          line('error', `could not list models: ${error}`);
          mark('');
          return;
        }
        if (!listed.models.length) {
          line('note', 'this harness offers no model list');
          mark('');
          return;
        }
        const at = listed.models.findIndex((model) => model.id === listed.current);
        picker = { models: listed.models, current: listed.current, shown: [], index: filter || order ? 0 : Math.max(at, 0), backups: order, saved: order, spent: new Set(), left: new Map() };
        out.style.display = 'none';
        pick.style.display = 'block';
        input.value = filter;
        tint();
        mark('');
        if (order) notice('enter adds or removes a backup. esc is done');
        drawPicker();
        // Which providers have nothing left, once the harness has said. The list does not wait for it.
        const opened = picker;
        invoke('providers')
          .then((states) => {
            if (picker !== opened) return;
            picker.spent = new Set(states.filter((state) => state.limit_reached === true).map((state) => state.provider));
            picker.left = new Map(states.map((state) => [state.provider, leftOn(state)]).filter(([, words]) => words));
            if (picker.spent.size || picker.left.size) drawPicker();
          })
          .catch(() => {});
      };

      const chooseModel = async (model) => {
        if (!model) return;
        if (picker && picker.backups) {
          // Add it to the end of the order, or take it out. The list stays open.
          const order = picker.backups;
          picker.backups = order.includes(model.id) ? order.filter((id) => id !== model.id) : order.concat(model.id);
          input.value = '';
          picker.index = 0;
          drawPicker();
          return;
        }
        const current = picker && picker.current;
        closePicker();
        if (model.id === current) return;
        mark('working');
        try {
          await invoke('set_model', { id: model.id }); // the change arrives as an event
        } catch (error) {
          line('error', `could not switch to ${model.id}: ${error}`);
        }
        mark('');
      };

      // ── Choosing the harness ───────────────────────────────────────────
      //
      // Null carries its own Oh-my-pi and runs that one. /harness shows it and,
      // beside it, an Oh-my-pi of the user's own when one is on this Mac, for
      // someone who would sooner run theirs. Null was checked with the version it
      // carries, so any other version is said to be unchecked.

      const harnessName = (choice) => (choice.version ? `Oh-my-pi ${choice.version}` : 'Oh-my-pi');

      const drawHarness = () => {
        pick.textContent = '';
        pick.append(el('div', 'provider', 'harness'));
        picker.shown.forEach((choice, index) => {
          const own = choice.origin === 'own';
          const about = [harnessName(choice)];
          if (own) about.push(choice.path.replace(/^\/Users\/[^/]+/, '~'));
          if (!choice.checked) about.push('not checked with Null');
          const lead = `${choice.current ? '● ' : '  '}${own ? 'yours' : 'built in'} `;
          const row = el('div', index === picker.index ? 'option selected' : 'option', el('span', '', lead), el('span', 'id', about.join(' · ')));
          row.addEventListener('click', () => chooseHarness(choice));
          pick.append(row);
        });
        fit();
      };

      const openHarness = async () => {
        if (picker || signin) return;
        if (busy) {
          notice('stop the reply with ctrl+c before changing the harness');
          return;
        }
        mark('working');
        let choices;
        try {
          choices = await invoke('harnesses');
        } catch (error) {
          line('error', `could not list the harnesses: ${error}`);
          mark('');
          return;
        }
        mark('');
        if (!choices.length) {
          line('error', 'no Oh-my-pi was found');
          return;
        }
        const at = choices.findIndex((choice) => choice.current);
        picker = { harness: true, models: [], current: null, shown: choices, index: Math.max(at, 0), backups: null, saved: [], spent: new Set(), left: new Map() };
        out.style.display = 'none';
        pick.style.display = 'block';
        input.value = '';
        tint();
        drawHarness();
        // What the choice means, for as long as it is being made.
        if (choices.some((choice) => choice.origin === 'own')) notice('built in stays until Null is updated. yours follows omp update', true);
      };

      const chooseHarness = async (choice) => {
        if (!choice) return;
        closePicker();
        if (choice.current) return;
        mark('working');
        try {
          const now = await invoke('set_harness', { path: choice.origin === 'own' ? choice.path : null });
          const whose = now.origin === 'own' ? 'your' : 'the built-in';
          line('note', `now on ${whose} ${harnessName(now)}${now.checked ? '' : '. Null was not checked with it'}`);
        } catch (error) {
          line('error', `could not change the harness: ${error}`);
        }
        mark('');
      };

      // /update moves the built-in Oh-my-pi forward when the user asks: to the
      // newest version the repository has checked with Null, never an unchecked
      // one. The app says in the notice line when it starts fetching, which is
      // about 200 MB.
      const updateHarness = async () => {
        if (picker || signin) return;
        if (busy) {
          notice('stop the reply with ctrl+c before updating');
          return;
        }
        mark('working');
        try {
          const did = await invoke('update_harness');
          if (did.outcome === 'updated') line('note', `the built-in Oh-my-pi is now ${did.version}${did.on_own ? '. you are on yours: /harness switches' : ''}`);
          else if (did.outcome === 'needs_null') line('note', `Oh-my-pi ${did.version} needs Null ${did.null} or newer, and this is Null ${did.this_null}. update Null, then /update again`);
          else line('note', `already on the newest checked Oh-my-pi, ${did.version}`);
          // Null does not replace itself: it says a newer one is out, and what gets it.
          if (did.newer_null) {
            line('note', `Null ${did.newer_null} is out, and this is Null ${did.this_null}. to get it, run this in Terminal:`);
            line('step', did.install);
          }
        } catch (error) {
          line('error', `could not update: ${error}`);
        }
        mark(busy ? 'working' : '');
      };

      // ── History ────────────────────────────────────────────────────────
      //
      // The harness keeps every conversation. /history, or the button at the end
      // of the row, lists them as the harness does: the box's own and the ones
      // made in a terminal, each in the folder it works in. Choosing one opens it
      // here with what was said in it, and the next message continues it.
      //
      // The list is sorted by when, under today, yesterday, this week and then
      // each month. Tab sorts it by folder instead, the box's own first, when
      // there is more than one folder. Typing narrows it by title and folder.
      //
      // While the list is open it takes the keys and the typing before the
      // field's own handlers see them, so that those need not know of it.

      const historyButton = document.getElementById('history');
      let historyBy = 'when'; // or 'folder'; kept for as long as the app runs

      // How many days ago by the calendar: 0 is today.
      const daysAgo = (when) => {
        const midnight = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
        return Math.round((midnight(new Date()) - midnight(when)) / 86400000);
      };
      const thisYear = (when) => when.getFullYear() === new Date().getFullYear();

      // The heading a conversation stands under when the list is sorted by when.
      const era = (entry) => {
        if (!entry.when) return 'earlier';
        const ago = daysAgo(entry.when);
        if (ago < 1) return 'today';
        if (ago < 2) return 'yesterday';
        if (ago < 7) return 'this week';
        const month = entry.when.toLocaleDateString([], { month: 'long' });
        return thisYear(entry.when) ? month : `${month} ${entry.when.getFullYear()}`;
      };

      // When it was last used, said briefly: the time if that was today, the day
      // if it was this week, the date before that.
      const usedAt = (entry, byFolder) => {
        if (!entry.when) return '';
        const ago = daysAgo(entry.when);
        if (ago < 1 || (ago < 2 && !byFolder)) return entry.when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase();
        if (ago < 2) return 'yesterday';
        if (ago < 7) return entry.when.toLocaleDateString([], { weekday: 'short' }).toLowerCase();
        const date = entry.when.toLocaleDateString([], { month: 'short', day: 'numeric' }).toLowerCase();
        return thisYear(entry.when) ? date : `${date} ${entry.when.getFullYear()}`;
      };

      // A folder as a heading names it: ~ for the home folder, and only its last
      // two parts when it is deep. In a row it is its last part alone.
      const folderPath = (folder) => {
        const short = folder.replace(/^\/Users\/[^/]+/, '~');
        const parts = short.split('/').filter(Boolean);
        return parts.length > 3 ? `…/${parts.slice(-2).join('/')}` : short;
      };
      const folderName = (folder) => folder.split('/').filter(Boolean).pop() || folder;

      const drawHistory = () => {
        const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
        const byFolder = historyBy === 'folder' && picker.folders > 1;
        const recent = (a, b) => (b.when ? b.when.getTime() : 0) - (a.when ? a.when.getTime() : 0);
        const matching = picker.conversations
          .filter((entry) => {
            const haystack = `${entry.title || 'untitled'} ${entry.own ? 'the box' : entry.folder}`.toLowerCase();
            return words.every((word) => haystack.includes(word));
          })
          .sort(recent);
        if (byFolder) {
          // The box's own first, then each folder by its most recent conversation.
          const place = new Map();
          matching.forEach((entry, index) => {
            const folder = entry.own ? '' : entry.folder;
            if (!place.has(folder)) place.set(folder, entry.own ? -1 : index);
          });
          matching.sort((a, b) => place.get(a.own ? '' : a.folder) - place.get(b.own ? '' : b.folder));
        }
        picker.shown = matching;
        picker.index = Math.min(picker.index, Math.max(matching.length - 1, 0));
        pick.textContent = '';
        let under = null;
        matching.forEach((entry, index) => {
          const heading = byFolder ? (entry.own ? 'the box' : folderPath(entry.folder) || 'no folder') : era(entry);
          if (heading !== under) {
            under = heading;
            pick.append(el('div', 'provider', heading));
          }
          const where = byFolder ? usedAt(entry, true) : [entry.own ? '' : folderName(entry.folder), usedAt(entry, false)].filter(Boolean).join(' · ');
          const title = el('span', entry.title ? '' : 'id', `${entry.open ? '● ' : '  '}${entry.title || 'untitled'}`);
          const row = el('div', index === picker.index ? 'option past selected' : 'option past', title, el('span', 'id where', where));
          row.addEventListener('click', () => {
            chooseEarlier(entry);
            input.focus();
          });
          pick.append(row);
          if (index === picker.index && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
        });
        if (!matching.length) pick.append(el('div', 'provider', 'no conversation matches'));
        // The one key here that nothing else says.
        if (picker.folders > 1) notice(byFolder ? 'tab sorts by when' : 'tab sorts by folder', true);
        fit();
      };

      const closeHistory = () => {
        const said = picker.folders > 1;
        historyButton.classList.remove('on');
        closePicker();
        if (said) unnotice();
      };

      const openHistory = async (filter = '') => {
        if (picker || signin) return;
        if (busy) {
          notice('stop the reply with ctrl+c before opening another conversation');
          return;
        }
        mark('working');
        let listed;
        try {
          listed = await invoke('history');
        } catch (error) {
          line('error', `could not list the earlier conversations: ${error}`);
          mark('');
          return;
        }
        mark(busy ? 'working' : '');
        if (picker || signin || busy) return; // something else was begun meanwhile
        if (!listed.lists) {
          line('note', 'this harness does not list earlier conversations');
          return;
        }
        if (!listed.conversations.length) {
          notice('no earlier conversations');
          return;
        }
        const conversations = listed.conversations.map((entry) => {
          const when = entry.used ? new Date(entry.used) : null;
          return { ...entry, when: when && !Number.isNaN(when.getTime()) ? when : null };
        });
        const folders = new Set(conversations.map((entry) => (entry.own ? '' : entry.folder))).size;
        picker = { history: true, conversations, folders, opening: false, models: [], current: null, shown: [], index: 0, backups: null, saved: [], spent: new Set(), left: new Map() };
        out.style.display = 'none';
        pick.style.display = 'block';
        input.value = filter;
        tint();
        historyButton.classList.add('on');
        drawHistory();
      };

      const chooseEarlier = async (entry) => {
        if (!entry || picker.opening) return;
        // The one that is open is asked for like any other: after the app was
        // started again the box is on it and shows little or nothing of it.
        const list = picker;
        list.opening = true;
        mark('working');
        try {
          await invoke('open_conversation', { id: entry.id }); // it arrives as an event
          await catchUp(); // should the event have been missed
        } catch (error) {
          // It would not load: the box stays on the conversation it had.
          if (picker === list) closeHistory();
          line('error', `could not open that conversation: ${error}`);
          return;
        }
        if (picker === list) closeHistory();
      };

      // An earlier conversation has been opened: the box shows it, in place of
      // what it showed, as the replies it once drew.
      const showEarlier = (event) => {
        out.textContent = '';
        out.style.display = 'none';
        toolLines.clear();
        reply = null;
        steps = null;
        anchor = null;
        pendingAsk = null;
        event.events.forEach(show);
        // What was replayed is over, whatever it ended on.
        reply = null;
        foldSteps();
        running.clear();
        following = true;
        if (picker && picker.history) closeHistory();
        mark(busy ? 'working' : '');
        // Nothing has just happened here: the pet rests, whatever was replayed
        // and whatever it was saying of the conversation before.
        noAnswer = false;
        if (!busy) mood('rest');
        // It is on the model it was left on, which the next message goes to.
        if (event.model) line('note', `now on ${event.model}`);
        place();
        fit();
      };

      window.addEventListener(
        'keydown',
        (event) => {
          if (!picker || !picker.history || (event.key === 'c' && event.ctrlKey)) return;
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            const step = event.key === 'ArrowDown' ? 1 : -1;
            picker.index = Math.max(0, Math.min(picker.shown.length - 1, picker.index + step));
            drawHistory();
          } else if (event.key === 'Enter' && !event.isComposing) {
            chooseEarlier(picker.shown[picker.index]);
          } else if (event.key === 'Tab') {
            if (picker.folders > 1) {
              historyBy = historyBy === 'when' ? 'folder' : 'when';
              picker.index = 0;
              drawHistory();
            }
          } else if (event.key === 'Escape') {
            closeHistory();
          } else {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
        },
        true,
      );

      window.addEventListener(
        'input',
        (event) => {
          if (!picker || !picker.history) return;
          event.stopPropagation();
          tint();
          picker.index = 0;
          drawHistory();
        },
        true,
      );

      // A press on the button leaves the typing in the field.
      historyButton.addEventListener('mousedown', (event) => event.preventDefault());
      historyButton.addEventListener('click', () => {
        if (picker && picker.history) closeHistory();
        else openHistory();
      });

      // ── Signing in to a provider ───────────────────────────────────────
      //
      // The harness knows how each provider signs in. /login shows the harness's
      // own list, then its own steps as it gives them, and passes back what the
      // user types. That may be a key, so the field hides it, and nothing typed
      // during a sign-in is ever drawn in the box.

      const drawSignin = () => {
        const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
        signin.shown = signin.providers.filter((provider) => words.every((word) => provider.label.toLowerCase().includes(word)));
        signin.index = Math.min(signin.index, Math.max(signin.shown.length - 1, 0));
        pick.textContent = '';
        const heading = document.createElement('div');
        heading.className = 'provider';
        heading.textContent = signin.shown.length ? 'sign in to' : 'no provider matches';
        pick.appendChild(heading);
        signin.shown.forEach((provider, index) => {
          const row = document.createElement('div');
          row.className = index === signin.index ? 'option selected' : 'option';
          row.textContent = provider.label;
          row.addEventListener('click', () => chooseProvider(provider));
          pick.appendChild(row);
          if (index === signin.index && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
        });
        fit();
      };

      // The first opening is over, however its sign-in went: say what a newcomer
      // has to know before the agent does anything for them.
      const endWelcome = (signedIn) => {
        if (!welcome) return;
        const { freely } = welcome;
        welcome = null;
        unnotice();
        if (!signedIn) line('note', 'no provider is signed in. /login signs in');
        if (freely) line('note', 'the agent may act without asking you first');
      };

      const endSignin = () => {
        signin = null;
        input.type = 'text';
        input.value = '';
        tint();
        pick.style.display = 'none';
        pick.textContent = '';
        if (out.textContent) out.style.display = 'block';
        mark(busy ? 'working' : '');
        fit();
      };

      const cancelSignin = () => {
        if (signin.stage === 'choose') {
          endSignin();
          endWelcome(false);
          return;
        }
        signin.cancelled = true;
        invoke('signin_cancel').catch(() => {}); // the app then reports the sign-in over
      };

      const openSignin = async () => {
        if (signin || picker) return;
        mark('working');
        let providers;
        try {
          providers = await invoke('signin_providers');
        } catch (error) {
          line('error', `could not start a sign-in: ${error}`);
          mark('');
          endWelcome(false);
          return;
        }
        signin = { stage: 'choose', providers, shown: [], index: 0, before: null, cancelled: false };
        out.style.display = 'none';
        pick.style.display = 'block';
        input.value = '';
        tint();
        mark('');
        drawSignin();
      };

      // The providers whose models the box can reach now, and the provider of the
      // model in use. Null when that cannot be told.
      const reachable = async () => {
        try {
          const listed = await invoke('models');
          const inUse = listed.models.find((model) => model.id === listed.current);
          return {
            providers: new Set(listed.models.map((model) => model.provider).filter(Boolean)),
            current: listed.current || null,
            currentProvider: (inUse && inUse.provider) || null,
          };
        } catch (error) {
          return null;
        }
      };

      const chooseProvider = async (provider) => {
        if (!provider || !signin || signin.stage !== 'choose') return;
        signin.stage = 'steps';
        pick.style.display = 'none';
        pick.textContent = '';
        input.value = '';
        input.type = 'password';
        if (welcome) unnotice(); // the first opening's words were about choosing
        line('note', `signing in to ${provider.label}. esc cancels`);
        mark('working');
        const before = await reachable();
        if (!signin) return; // cancelled meanwhile
        signin.before = before;
        try {
          await invoke('signin_start', { number: provider.number });
        } catch (error) {
          line('error', String(error));
          endSignin();
        }
      };

      const shortAddress = (address) => {
        try {
          const { host, pathname } = new URL(address);
          const shown = host + pathname;
          return shown.length > 56 ? `${shown.slice(0, 55)}…` : shown;
        } catch (error) {
          return address;
        }
      };

      // A line from the harness. A web address in it opens that page when clicked.
      const stepLine = (text) => {
        const element = line('step', '');
        text.split(/(https?:\/\/\S+)/).forEach((part) => {
          if (!/^https?:\/\//.test(part)) {
            element.appendChild(document.createTextNode(part));
            return;
          }
          const link = document.createElement('span');
          link.className = 'link';
          link.textContent = shortAddress(part);
          link.addEventListener('click', () => invoke('open_url', { url: part }).catch(() => {}));
          element.appendChild(link);
        });
        place();
        fit();
      };

      listen('mini:signin', async (message) => {
        if (!signin) return;
        const said = message.payload;
        if (said.kind === 'line') {
          stepLine(said.text);
          mark('working');
          return;
        }
        if (said.kind === 'ask') {
          stepLine(said.text);
          mark('asking'); // the harness is waiting for what the user types
          input.focus();
          return;
        }
        // Over. When it failed, the harness has already said why.
        const { before, cancelled } = signin;
        endSignin();
        let added = [];
        let after = null;
        if (cancelled) {
          line('note', 'sign-in cancelled');
        } else if (said.ok) {
          // Check the result, not the steps: is the provider's model list there now?
          mark('working');
          after = await reachable();
          mark(busy ? 'working' : '');
          added = before && after ? [...after.providers].filter((provider) => !before.providers.has(provider)) : [];
          const names = added.join(', ');
          if (!added.length) line('note', before && after ? 'the sign-in finished, but no new provider appeared under /model' : 'the sign-in finished');
          else if (!after.current) line('note', `signed in to ${names}`);
          else if (added.includes(after.currentProvider)) line('note', `signed in to ${names}. now on ${after.current}`);
          // The harness keeps a conversation on the model it had, which may be a small local one.
          else line('note', `signed in to ${names}. still on ${after.current}. /model changes it`);
        }
        const first = !!welcome;
        endWelcome(added.length > 0);
        // A newcomer who had only a local model is still on it. Show the new provider's models.
        if (first && added.length && after.current && !added.includes(after.currentProvider)) openPicker(added[0]);
      });

      // The first opening. Nothing is signed in, so the app has opened the box by
      // itself, this once: say so, and show the harness's sign-in list.
      listen('mini:welcome', (message) => {
        welcome = { freely: !!(message.payload && message.payload.freely) };
        // The user got there first and is in the middle of something: only say it.
        if (signin || picker || busy) {
          endWelcome(false);
          return;
        }
        notice('no provider is signed in. choose one, or esc for later', true);
        openSignin();
      });

      const send = async (text) => {
        if (text === '/model' || text.startsWith('/model ')) {
          openPicker(text.slice(6).trim());
          return;
        }
        if (text === '/backup' || text.startsWith('/backup ')) {
          openPicker(text.slice(7).trim(), true);
          return;
        }
        if (text === '/usage') {
          openUsage();
          return;
        }
