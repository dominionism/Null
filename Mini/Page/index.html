        if (text === '/login') {
          openSignin();
          return;
        }
        if (text === '/harness') {
          openHarness();
          return;
        }
        if (text === '/update') {
          updateHarness();
          return;
        }
        if (text === '/attach' || text.startsWith('/attach ')) {
          attach(text.slice(7).trim(), text);
          return;
        }
        if (text === '/history' || text.startsWith('/history ')) {
          openHistory(text.slice(8).trim());
          return;
        }
        if (text === '/pet') {
          // The page and the window change together: the box stays where it is.
          showPet(!petShown);
          invoke('set_pet', { on: petShown }).catch((error) => notice(String(error)));
          return;
        }
        if (text === '/quit') {
          invoke('quit');
          return;
        }
        if (text === '/new') {
          try {
            await invoke('new_conversation');
          } catch (error) {
            notice(String(error));
            return;
          }
          out.textContent = '';
          out.style.display = 'none';
          toolLines.clear();
          reply = null;
          steps = null;
          anchor = null;
          mood('rest'); // whatever the pet was saying of the last conversation is over
          fit();
          return;
        }
        // A lone slash-word that is not one of the box's commands is a slip, or a
        // command the box does not have. Sent on, the agent takes it for a message
        // and sets off trying to work out what was meant. Hand it back instead.
        if (/^\/[\w:-]+$/.test(text)) {
          input.value = text;
          tint();
          // The line holds about 81 characters, and the commands alone are 78: a
          // sentence around them would be cut off before the last of them.
          notice(COMMANDS.join(' '));
          return;
        }
        if (busy) {
          notice('still working. ctrl+c stops it');
          return;
        }
        busy = true;
        lastPrompt = text;
        mark('working');
        watchQuiet();
        try {
          await invoke('send', { text }); // the reply arrives as events
        } catch (error) {
          busy = false;
          line('error', `could not send: ${error}`);
          mark('');
        }
      };

      const answer = async (optionId) => {
        if (!pendingAsk) return;
        const { requestId, element } = pendingAsk;
        pendingAsk = null;
        element.querySelectorAll('button').forEach((button) => (button.disabled = true));
        try {
          await invoke('respond', { requestId, answer: optionId });
        } catch (error) {
          line('error', `could not answer: ${error}`);
        }
      };

      // ── Attached files ─────────────────────────────────────────────────
      //
      // /attach, or the plus at the end of the row, hands the agent a file with
      // the next message. Null uploads nothing: the file stays where it is and
      // the harness is told where (src/attach.rs). The list walks the folders of
      // this Mac without leaving the box: typing narrows it, Enter opens a
      // folder, attaches a file or takes an attached one off, and it opens where
      // it was last. /attach with a path attaches that file at once. What is
      // attached stands on the notice line until it is sent. A file's name is
      // data: it only ever becomes text.

      const attachButton = document.getElementById('attach');
      const MOST_ROWS = 200; // a folder of thousands is narrowed by typing, not drawn whole
      let attached = []; // { name, path, within }: what goes with the next message
      let draft = ''; // what was in the field when the plus was pressed: it comes back

      // The notice line says what is attached whenever it has nothing newer to
      // say. A press on a name takes that file off. True when there is one.
      const restAttached = () => {
        if (!attached.length) return false;
        clearTimeout(noticeTimer);
        noticeLine.textContent = 'attached: ';
        attached.forEach((file, index) => {
          const name = el('button', 'off', file.name);
          name.type = 'button';
          name.tabIndex = -1;
          name.setAttribute('aria-label', `take off ${file.name}`);
          name.addEventListener('mousedown', (event) => event.preventDefault()); // the typing stays in the field
          name.addEventListener('click', () => invoke('detach_file', { path: file.path }).catch(() => {}));
          noticeLine.append(index ? ' · ' : '', name);
        });
        noticeLine.style.display = 'block';
        fit();
        return true;
      };

      // Under the owner's message: what went with it.
      const wentWith = (message, files) => {
        if (!files || !files.length) return;
        message.append(el('div', 'with', `attached: ${files.map((file) => file.name).join(' · ')}`));
      };

      // A long folder keeps its end, which is where the person is.
      const shortPath = (path) => {
        if (path.length <= 76) return path;
        const end = path.slice(-72);
        return `…${end.slice(Math.max(end.indexOf('/'), 0))}`;
      };

      // The rows of the list: what is attached first, wherever it is, then the
      // folder. A path typed from the root or from ~ goes straight there.
      const fileRows = () => {
        const { listing } = picker;
        const typed = input.value.trim();
        if (/^[/~]/.test(typed)) return [{ name: typed, path: typed, typed: true }];
        const words = typed.toLowerCase().split(/\s+/).filter(Boolean);
        const wanted = (row) => words.every((word) => row.name.toLowerCase().includes(word));
        const taken = new Set(attached.map((file) => file.path));
        const dots = typed.startsWith('.'); // a name that starts with a dot stays out until one is asked for
        const up = listing.parent && (!words.length || typed === '..') ? [{ name: '..', path: listing.parent, folder: true }] : [];
        const here = listing.entries.filter((entry) => !taken.has(entry.path) && (dots || !entry.name.startsWith('.')) && wanted(entry));
        return attached
          .filter(wanted)
          .map((file) => ({ ...file, attached: true }))
          .concat(up, here);
      };

      const drawFiles = () => {
        const { listing } = picker;
        const rows = fileRows();
        // A list just opened or narrowed starts below what is attached, so that
        // Enter adds the file that was looked for and does not take one off.
        if (picker.index < 0) picker.index = Math.max(rows.findIndex((row) => !row.attached), 0);
        picker.shown = rows.slice(0, MOST_ROWS);
        picker.index = Math.min(picker.index, Math.max(picker.shown.length - 1, 0));
        pick.textContent = '';
        const where = () => el('div', 'provider where', shortPath(listing.shown));
        let group = null;
        picker.shown.forEach((row, index) => {
          const kind = row.attached ? 'attached' : row.typed ? 'go to' : 'folder';
          if (kind !== group) {
            group = kind;
            pick.append(kind === 'folder' ? where() : el('div', 'provider', kind));
          }
          const option = el('div', index === picker.index ? 'option selected' : 'option', el('span', '', `${row.attached ? '● ' : '  '}${row.name}${row.folder ? '/' : ''} `));
          if (row.attached) option.append(el('span', 'id', row.within));
          option.addEventListener('click', () => chooseFile(row));
          pick.append(option);
          if (index === picker.index && option.scrollIntoView) option.scrollIntoView({ block: 'nearest' });
        });
        if (group !== 'folder' && group !== 'go to') pick.append(where(), el('div', 'provider', input.value.trim() ? 'no file matches' : 'nothing here'));
        if (rows.length > MOST_ROWS) pick.append(el('div', 'provider where', `  and ${rows.length - MOST_ROWS} more. type to narrow`));
        if (listing.cut) pick.append(el('div', 'provider where', `  ${listing.cut} more are past what the list holds. /attach with a path reaches them`));
        fit();
      };

      // Show a folder: the one named, or the one the list last showed. `keep` is
      // what the field held when the plus was pressed.
      const openFiles = async (folder, keep = '') => {
        const elsewhere = () => signin || (picker && !picker.files);
        if (elsewhere()) return;
        let listing;
        try {
          listing = await invoke('attach_list', { folder: folder || null });
        } catch (error) {
          notice(String(error));
          return;
        }
        if (elsewhere()) return; // another list was opened meanwhile
        if (!picker) {
          draft = keep;
          attachButton.classList.add('on');
          notice(`enter opens a folder${attached.length ? ', attaches a file or takes one off' : ' or attaches a file'}. esc is done`);
        }
        picker = { files: true, listing, models: [], current: null, shown: [], index: -1, backups: null, saved: [], spent: new Set(), left: new Map() };
        out.style.display = 'none';
        pick.style.display = 'block';
        input.value = '';
        tint();
        drawFiles();
      };

      // Attach the file at a path. A folder opens in the list instead. What
      // cannot be attached is said in one line, and a command is handed back.
      const attachPath = async (path, typed) => {
        let added;
        try {
          added = await invoke('attach_file', { path });
        } catch (error) {
          if (typed && !picker && !input.value) {
            input.value = typed;
            tint();
          }
          notice(String(error));
          return;
        }
        if (added.kind === 'folder') openFiles(added.path);
        else if (picker && picker.files) closePicker(); // what is attached arrives as an event
      };

      const attach = (path, typed) => (path ? attachPath(path, typed) : openFiles());

      const chooseFile = async (row) => {
        if (!row) return;
        if (row.folder) {
          openFiles(row.path);
        } else if (row.attached) {
          await invoke('detach_file', { path: row.path }).catch(() => {});
          if (picker && picker.files) closePicker();
        } else {
          attachPath(row.path);
        }
      };

      const narrowFiles = () => {
        picker.index = -1;
        drawFiles();
      };

      const filesKey = (event) => {
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          const step = event.key === 'ArrowDown' ? 1 : -1;
          picker.index = Math.max(0, Math.min(picker.shown.length - 1, picker.index + step));
          drawFiles();
        } else if (event.key === 'Enter' && !event.isComposing) {
          chooseFile(picker.shown[picker.index]);
        }
      };

      // A list has been put away. If it was this one, the plus goes quiet, the
      // list's own words go, and what was being typed when the plus was pressed
      // comes back.
      const filesClosed = () => {
        if (!attachButton.classList.contains('on')) return;
        attachButton.classList.remove('on');
        unnotice();
        if (draft) {
          input.value = draft;
          draft = '';
          tint();
        }
      };

      // The plus is a second way in to /attach. A press on it, or on a row of
      // its list, leaves the typing in the field, and a button never starts
      // moving the box.
      attachButton.addEventListener('mousedown', (event) => event.preventDefault());
      attachButton.addEventListener('click', () => {
        if (picker && picker.files) closePicker();
        else openFiles(null, input.value);
      });
      pick.addEventListener('mousedown', (event) => {
        if (picker && picker.files) event.preventDefault();
      });

      // The app says what is attached each time it changes: a file was added or
      // taken off, or a message took them with it.
      const showAttached = (files) => {
        const shown = noticeLine.style.display !== 'none' && !!noticeLine.querySelector('.off');
        attached = files || [];
        if (!restAttached() && shown) unnotice();
        if (picker && picker.files) drawFiles();
      };
      listen('mini:attached', (message) => showAttached(message.payload));
      invoke('attached')
        .then(showAttached)
        .catch(() => {});

      // ── Moving the box ─────────────────────────────────────────────────
      //
      // Press and drag anywhere that is not text. The frame (the edge, the arrow,
      // the gaps, the shadow's margin, empty transcript space) moves the box at
      // once. The unused part of the text field moves it only after the pointer has
      // travelled, so a plain click there still just puts the typing cursor in the
      // field. Typed text, transcript text, buttons, model rows and scroll bars
      // keep their presses.

      const TRAVEL = 4; // pixels before a press in the text field becomes a move
      const SCROLL_BAR = 12;
      let press = null; // where a press in the unused part of the text field began

      const moveBox = () => {
        press = null;
        window.__TAURI__.window.getCurrentWindow().startDragging().catch(() => {});
      };

      // Where the typed text ends inside the field, in page pixels.
      const typedEnd = () => {
        ruler.textContent = input.value;
        const end = input.getBoundingClientRect().left + ruler.getBoundingClientRect().width - input.scrollLeft;
        ruler.textContent = '';
        return end;
      };

      // True on a line of text, or left of where that line ends: where the I-beam
      // shows and a press should start selecting.
      const onText = (element, x, y) => {
        const range = document.createRange();
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        for (let node = walker.nextNode(); node; node = walker.nextNode()) {
          range.selectNodeContents(node);
          for (const rect of range.getClientRects()) {
            if (y >= rect.top - 3 && y <= rect.bottom + 3 && x <= rect.right + 8) return true;
          }
        }
        return false;
      };

      // 'frame', 'field', or null when the press belongs to what is under it.
      const grip = (event) => {
        const target = event.target;
        const within = (selector) => (target.closest ? target.closest(selector) : null);
        if (within('button, .option')) return null;
        if (target === input) {
          if (event.detail > 1) return null; // a double click selects
          return event.clientX > typedEnd() + 8 ? 'field' : null;
        }
        const pane = within('#out, #pick');
        if (pane) {
          const scrolls = pane.scrollHeight > pane.clientHeight;
          if (scrolls && event.clientX >= pane.getBoundingClientRect().right - SCROLL_BAR) return null;
          if (pane === out && (event.shiftKey || onText(target, event.clientX, event.clientY))) return null;
        }
        return 'frame';
      };

      window.addEventListener('mousedown', (event) => {
        press = null;
        if (event.button !== 0 || event.ctrlKey) return; // not a right click, nor control-click
        const kind = grip(event);
        if (!kind) return;
        event.preventDefault(); // keep the typing cursor and any selection as they are
        if (kind === 'frame') {
          moveBox();
          return;
        }
        // What a click past the end of the text does anyway.
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        press = { x: event.clientX, y: event.clientY };
      });

      window.addEventListener('mousemove', (event) => {
        if (!press) return;
        if (!(event.buttons & 1)) {
          press = null;
          return;
        }
        if (Math.hypot(event.clientX - press.x, event.clientY - press.y) >= TRAVEL) moveBox();
      });

      window.addEventListener('mouseup', () => {
        press = null;
      });

      // ── Keys ───────────────────────────────────────────────────────────

      input.addEventListener('input', () => {
        tint();
        if (signin && signin.stage === 'choose') {
          signin.index = 0;
          drawSignin();
        }
        if (picker && picker.files) {
          narrowFiles();
          return;
        }
        if (picker && !picker.usage && !picker.harness) {
          picker.index = 0;
          drawPicker();
        }
      });

      input.addEventListener('keydown', (event) => {
        if (signin) {
          if (signin.stage === 'choose') {
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
              event.preventDefault();
              const step = event.key === 'ArrowDown' ? 1 : -1;
              signin.index = Math.max(0, Math.min(signin.shown.length - 1, signin.index + step));
              drawSignin();
            } else if (event.key === 'Enter' && !event.isComposing) {
              chooseProvider(signin.shown[signin.index]);
            }
          } else if (event.key === 'Enter' && !event.isComposing && input.value) {
            // What the harness asked for. It is handed over and not kept or shown.
            const text = input.value;
            input.value = '';
            mark('working');
            invoke('signin_answer', { text }).catch((error) => line('error', String(error)));
          }
          return;
        }
        if (picker && picker.files) {
          filesKey(event);
          return;
        }
        if (picker && picker.usage) {
          // Nothing to choose here: Enter, like Esc, puts the list away.
          if (event.key === 'Enter' && !event.isComposing) closePicker();
          return;
        }
        if (picker) {
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            const step = event.key === 'ArrowDown' ? 1 : -1;
            picker.index = Math.max(0, Math.min(picker.shown.length - 1, picker.index + step));
            (picker.harness ? drawHarness : drawPicker)();
          } else if (event.key === 'Enter' && !event.isComposing) {
            (picker.harness ? chooseHarness : chooseModel)(picker.shown[picker.index]);
          }
          return;
        }
        if (event.key === 'Enter' && !event.isComposing) {
          const text = input.value.trim();
          if (!text) return;
          input.value = '';
          tint();
          send(text);
        } else if (event.key === 'ArrowUp' && !input.value && lastPrompt) {
          input.value = lastPrompt;
          tint();
          event.preventDefault();
        } else if (pendingAsk && !input.value && /^[1-9]$/.test(event.key)) {
          const option = pendingAsk.options[Number(event.key) - 1];
          if (option) {
            event.preventDefault();
            answer(option.option_id);
          }
        }
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (signin) cancelSignin();
          else if (picker) closePicker();
          else invoke('hide_box');
        } else if (event.key === 'c' && event.ctrlKey) {
          // As in a terminal program: stop what is running; with nothing running,
          // quit. Quitting closes the conversation, so the next start is a fresh one.
          event.preventDefault();
          if (signin) cancelSignin();
          else if (busy) invoke('interrupt').catch(() => {});
          else invoke('quit');
        }
      });

      listen('mini:shown', () => {
        input.focus();
        if (!picker && !signin) catchUp(); // anything that arrived while hidden
        fit();
      });

      // Something the app needs the user to know, such as its shortcut being
      // unavailable. No words takes the line away again.
      listen('mini:notice', (message) => {
        if (message.payload) {
          notice(message.payload, true);
          return;
        }
        unnotice();
      });

      // Whether the pet shows is the app's to remember, and the window is already
      // as wide as that needs.
      invoke('pet')
        .then(showPet)
        .catch(() => {});
      catchUp();
      fit();
      invoke('page_ready');
    </script>
  </body>
</html>
