# The Oh-my-pi that Null carries: one version, chosen here, and changed only by a new Null.
#
# Mini/Scripts/engine fetches these files from that version's release into Mini/Engine/,
# where the build takes them from. A file whose checksum is not the one written here is
# refused, wherever it came from.

version = "18.12.2"

# The oldest Null this version was checked with. /update offers the version to that Null
# and to newer ones; an older Null is told to get a newer Null first.
null = "0.5.3"

# One line for each file of the release that travels with Null: the program for each kind
# of Mac Null is built for, and the licence and notices that have to go with a copy of it.
[sha256]
omp-darwin-arm64 = "abd9a5b0fef77f4204078e348e233faa0dd3d5d81719cf2b6a9b9478c10eee48"
LICENSE = "16c45f9d667442781f03fa198914cc39abcaa48ec5ed8f644643e554ca2fbf63"
"THIRD-PARTY-NOTICES.txt" = "768612d40a4d1788813b997b011290d0f08c426add452de6560bf227cd1fc29d"
