[package]
name = "null-mini"
version = "0.1.0"
description = "Null: a floating box that opens on Control+Space and drives your own agent harness"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the box is a transparent window.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Agent Client Protocol: how the app talks to the user's agent harness.
# The token count at the end of a reply is how a provider's refusal is told from an answer.
agent-client-protocol = { version = "3", features = ["process", "unstable_end_turn_token_usage"] }
futures = "0.3"
# Control+Space is an ordinary system-wide shortcut, which macOS grants without asking the user.
tauri-plugin-global-shortcut = "2"
pulldown-cmark = { version = "0.13.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The box is a non-activating panel. Pinned to the revision it was proven with.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
objc = "0.2"
